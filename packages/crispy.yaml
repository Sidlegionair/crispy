# ================================================================
# CRISPY MODE  FULL PACKAGE
# ================================================================
#
# IMPORTANT:
# Disable the old UI automation "HRC - Crispy Mode".
# This package contains HRC - Crispy Mode V2.
#
# Existing UI helpers expected:
#   input_boolean.crispy_mode
#   input_number.crispy_target
#
# Existing RAMSES commands expected:
#   bypass_open
#   bypass_auto
#   auto
#   low_60
#   medium_60
#   high_60
#
# ================================================================


# ================================================================
# HELPERS
# ================================================================

input_boolean:

  crispy_quiet_mode:
    name: Crispy Guest Quiet Mode
    icon: mdi:volume-low

  # Tracks whether Guest Quiet was started with a timer. No `initial` value is
  # intentional: Home Assistant restores it across restarts so an expired
  # timer can be reconciled safely at startup.
  crispy_quiet_timed:
    name: Crispy Guest Quiet Timed
    icon: mdi:timer-outline

  crispy_heatwave_mode:
    name: Crispy Heatwave Mode
    icon: mdi:weather-sunny-alert

  crispy_predictive_control:
    name: Crispy Predictive Control
    icon: mdi:chart-timeline-variant-shimmer
    initial: true

  crispy_moisture_control:
    name: Crispy Moisture Control
    icon: mdi:water-percent
    initial: true

  crispy_moisture_active:
    name: Crispy Moisture Demand Active
    icon: mdi:water-alert
    initial: false

  crispy_laundry_mode:
    name: Crispy Laundry Drying Mode
    icon: mdi:hanger
    initial: false

  crispy_laundry_wet_seen:
    name: Crispy Laundry Wet Load Seen
    icon: mdi:water-check
    initial: false

  crispy_external_override:
    name: Crispy External Higher Demand
    icon: mdi:account-arrow-up
    initial: false

  crispy_bypass_forced:
    name: Crispy Bypass Forced
    icon: mdi:valve-open
    initial: false

  # Tracks ownership of the bound virtual remote's fan request. No `initial`
  # value is intentional: Home Assistant restores it after a restart so
  # Crispy can still release a pre-restart timed command back to fan AUTO.
  crispy_fan_override_active:
    name: Crispy Fan Override Active
    icon: mdi:fan-clock

  crispy_thermal_pressure_active:
    name: Crispy Thermal Pressure Active
    icon: mdi:thermometer-alert
    initial: false


input_number:

  crispy_cruise_entry_rate:
    name: Crispy Cruise Entry Rate
    min: -4
    max: 4
    step: 0.001
    mode: box
    unit_of_measurement: "°C/h"

  crispy_watchdog_intake:
    name: Crispy Watchdog Intake Baseline
    min: -40
    max: 80
    step: 0.1
    mode: box
    unit_of_measurement: "°C"

  crispy_min_intake:
    name: Crispy Minimum Intake
    icon: mdi:snowflake-alert
    min: -10
    max: 20
    step: 0.5
    initial: 12
    mode: box
    unit_of_measurement: "°C"

  crispy_ac_capacity_kw:
    name: AC Thermal Capacity
    icon: mdi:air-conditioner
    min: 0.5
    max: 10
    step: 0.01
    initial: 2.64
    mode: box
    unit_of_measurement: "kW"

  crispy_session_start_temp:
    name: Crispy Session Start Temperature
    min: 0
    max: 40
    step: 0.01
    mode: box
    unit_of_measurement: "°C"

  crispy_session_start_energy:
    name: Crispy Session Start Energy
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"

  crispy_laundry_baseline_ah:
    name: Crispy Laundry Baseline Absolute Humidity
    min: 0
    max: 30
    step: 0.01
    mode: box
    unit_of_measurement: "g/m³"


input_select:
  crispy_thermal_phase:
    name: Crispy Thermal Phase
    options:
      - idle
      - attack
      - cruise
      - release
    icon: mdi:state-machine

  crispy_held_fan_demand:
    name: Crispy Held Fan Demand
    options:
      - none
      - low
      - medium
      - high
    initial: none
    icon: mdi:fan-auto

  crispy_external_latched_mode:
    name: Crispy External Latched Mode
    options:
      - none
      - low
      - medium
      - high
    initial: none
    icon: mdi:shield-lock-outline


  crispy_control_strategy:
    name: Crispy Cooling Strategy
    icon: mdi:strategy
    options:
      - "Auto"
      - "Full Send"
    initial: "Auto"

  crispy_last_auto_mode:
    name: Crispy Last Automatic Mode
    icon: mdi:state-machine
    options:
      - "off"
      - "fault"
      - "frost"
      - "target"
      - "hold"
      - "low"
      - "medium"
      - "high"
      - "external"
      - "manual"
    # Restore the last controller-owned state across restarts. This lets a new
    # controller instance release a timed fan command left by the old one.


input_datetime:

  crispy_last_decision_change:
    name: Crispy Last Decision Change
    has_date: true
    has_time: true

  crispy_last_rf_fan_command:
    name: Crispy Last RF Fan Command
    has_date: true
    has_time: true


input_text:

  crispy_watchdog_reason:
    name: Crispy Watchdog Reason
    max: 100

  # Installation adapter: this is the only remote entity ID used by the
  # controller. Change it here; the RF scripts resolve it dynamically.
  crispy_remote_entity:
    name: Crispy RAMSES Remote Entity
    icon: mdi:remote
    initial: remote.rem_37_099999
    max: 100

  crispy_last_command:
    name: Crispy Last Command
    icon: mdi:radio-tower
    max: 100

  crispy_decision_trace:
    name: Crispy Decision Trace
    icon: mdi:timeline-text-outline
    max: 255


timer:

  crispy_cooling_retry:
    name: Crispy Cooling Retry
    duration: "00:10:00"
    restore: true

  crispy_guest_quiet:
    name: Crispy Guest Quiet
    icon: mdi:volume-low
    duration: "04:00:00"
    restore: true


# ================================================================
# DERIVATIVE / TREND SENSORS
# ================================================================

sensor:

  - platform: derivative
    source: sensor.crispy_hrc_indoor_temperature
    name: Crispy Indoor Rate
    unique_id: crispy_indoor_rate
    unit_time: h
    round: 2
    time_window: "01:00:00"
    max_sub_interval: "00:05:00"

  - platform: derivative
    source: sensor.crispy_hrc_indoor_temperature
    name: Crispy Indoor Fast Rate
    unique_id: crispy_indoor_fast_rate
    unit_time: h
    round: 2
    time_window: "00:15:00"
    max_sub_interval: "00:02:00"

  - platform: statistics
    name: Crispy Indoor Recent Low
    unique_id: crispy_indoor_recent_low
    entity_id: sensor.crispy_hrc_indoor_temperature
    state_characteristic: value_min
    max_age:
      hours: 2
    sampling_size: 200

  - platform: derivative
    source: sensor.crispy_hrc_intake_temperature
    name: Crispy Intake Rate
    unique_id: crispy_intake_rate
    unit_time: h
    round: 2
    time_window: "00:30:00"
    max_sub_interval: "00:05:00"

  - platform: derivative
    source: sensor.crispy_hrc_supply_temperature
    name: Crispy Supply Rate
    unique_id: crispy_supply_rate
    unit_time: h
    round: 2
    time_window: "00:30:00"
    max_sub_interval: "00:05:00"

  - platform: derivative
    source: sensor.crispy_hrc_indoor_humidity
    name: Crispy Indoor Humidity Rate
    unique_id: crispy_indoor_humidity_rate
    unit_time: h
    round: 2
    time_window: "00:15:00"
    max_sub_interval: "00:02:00"

  - platform: derivative
    source: sensor.crispy_indoor_absolute_humidity
    name: Crispy Indoor AH Rate
    unique_id: crispy_indoor_ah_rate
    unit_time: h
    round: 2
    time_window: "00:20:00"
    max_sub_interval: "00:02:00"


  # --------------------------------------------------------------
  # Thermal cooling W -> cumulative kWh
  # --------------------------------------------------------------

  - platform: integration
    source: sensor.crispy_cooling_power
    name: Crispy Cooling Energy
    unique_id: crispy_cooling_energy
    unit_prefix: k
    unit_time: h
    round: 3
    method: left
    max_sub_interval:
      minutes: 5


  # --------------------------------------------------------------
  # Statistics
  # --------------------------------------------------------------

  - platform: statistics
    name: Crispy Peak Cooling 24h
    unique_id: crispy_peak_cooling_24h
    entity_id: sensor.crispy_cooling_power
    state_characteristic: value_max
    max_age:
      hours: 24
    precision: 0

  - platform: statistics
    name: Crispy Lowest Intake 12h
    unique_id: crispy_lowest_intake_12h
    entity_id: sensor.crispy_hrc_intake_temperature
    state_characteristic: value_min
    max_age:
      hours: 12
    precision: 1

  - platform: statistics
    name: Crispy Lowest Supply 12h
    unique_id: crispy_lowest_supply_12h
    entity_id: sensor.crispy_hrc_supply_temperature
    state_characteristic: value_min
    max_age:
      hours: 12
    precision: 1

  - platform: statistics
    name: Crispy Best Cooling Rate 12h
    unique_id: crispy_best_cooling_rate_12h
    entity_id: sensor.crispy_indoor_rate
    state_characteristic: value_min
    max_age:
      hours: 12
    precision: 2


  # --------------------------------------------------------------
  # Runtime
  # --------------------------------------------------------------

  - platform: history_stats
    name: Crispy Free Cooling Runtime Today
    unique_id: crispy_free_cooling_runtime_today
    entity_id: binary_sensor.crispy_free_cooling_active
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Crispy Free Cooling Runtime Tonight
    unique_id: crispy_free_cooling_runtime_tonight
    entity_id: binary_sensor.crispy_free_cooling_active
    state: "on"
    type: time
    start: >-
      {% set boundary = today_at('18:00') %}
      {{
        boundary
        if now() >= boundary
        else boundary - timedelta(days=1)
      }}
    end: "{{ now() }}"


# ================================================================
# ENERGY METERS
# ================================================================

utility_meter:

  crispy_cooling_today:
    name: Crispy Cooling Today
    source: sensor.crispy_cooling_energy
    cycle: daily

  crispy_cooling_month:
    name: Crispy Cooling This Month
    source: sensor.crispy_cooling_energy
    cycle: monthly

  crispy_cooling_tonight:
    name: Crispy Cooling Since 18:00
    source: sensor.crispy_cooling_energy
    cycle: daily
    offset: "18:00:00"


# ================================================================
# TEMPLATE SENSORS
# ================================================================

template:

  - sensor:

      # ----------------------------------------------------------
      # INSTALLATION ADAPTER
      #
      # Map the local ramses_cc entities once here. Everything below this
      # block uses stable crispy_hrc_* entities and is installation-agnostic.
      # ----------------------------------------------------------

      - name: Crispy HRC Indoor Temperature
        unique_id: crispy_hrc_indoor_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_indoor_temperature') }}"
        state: "{{ states('sensor.fan_32_142350_indoor_temperature') | float }}"

      - name: Crispy HRC Intake Temperature
        unique_id: crispy_hrc_intake_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_outdoor_temperature') }}"
        state: "{{ states('sensor.fan_32_142350_outdoor_temperature') | float }}"

      - name: Crispy HRC Supply Temperature
        unique_id: crispy_hrc_supply_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_supply_temperature') }}"
        state: "{{ states('sensor.fan_32_142350_supply_temperature') | float }}"

      - name: Crispy HRC Supply Flow
        unique_id: crispy_hrc_supply_flow
        unit_of_measurement: "L/s"
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_supply_flow') }}"
        state: "{{ states('sensor.fan_32_142350_supply_flow') | float }}"

      - name: Crispy HRC Exhaust Flow
        unique_id: crispy_hrc_exhaust_flow
        unit_of_measurement: "L/s"
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_exhaust_flow') }}"
        state: "{{ states('sensor.fan_32_142350_exhaust_flow') | float }}"

      - name: Crispy HRC Indoor Humidity
        unique_id: crispy_hrc_indoor_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_indoor_humidity') }}"
        state: "{{ states('sensor.fan_32_142350_indoor_humidity') | float }}"

      - name: Crispy HRC Intake Humidity
        unique_id: crispy_hrc_intake_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_outdoor_humidity') }}"
        state: "{{ states('sensor.fan_32_142350_outdoor_humidity') | float }}"

      - name: Crispy HRC Fan Mode
        unique_id: crispy_hrc_fan_mode
        icon: mdi:fan
        availability: "{{ has_value('sensor.fan_32_142350_fan_mode') }}"
        state: "{{ states('sensor.fan_32_142350_fan_mode') | lower }}"

      - name: Crispy HRC Remaining Time
        unique_id: crispy_hrc_remaining_time
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_remaining_time') }}"
        state: "{{ states('sensor.fan_32_142350_remaining_time') | int }}"

      - name: Crispy HRC Bypass Mode
        unique_id: crispy_hrc_bypass_mode
        icon: mdi:pipe-valve
        availability: "{{ has_value('sensor.fan_32_142350_bypass_mode') }}"
        state: "{{ states('sensor.fan_32_142350_bypass_mode') }}"

      - name: Crispy HRC Filter Remaining
        unique_id: crispy_hrc_filter_remaining
        unit_of_measurement: d
        device_class: duration
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_filter_remaining') }}"
        state: "{{ states('sensor.fan_32_142350_filter_remaining') | float }}"

      - name: Crispy HRC Filter Remaining 2
        unique_id: crispy_hrc_filter_remaining_2
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ has_value('sensor.fan_32_142350_filter_remaining_2') }}"
        state: "{{ states('sensor.fan_32_142350_filter_remaining_2') | float }}"

      # ----------------------------------------------------------
      # Cooling power
      # ----------------------------------------------------------

      - name: Crispy Cooling Power
        unique_id: crispy_cooling_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_supply_temperature')
            and has_value('sensor.crispy_hrc_supply_flow')
          }}
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float %}
          {% set flow = states('sensor.crispy_hrc_supply_flow') | float %}
          {% set power = 1.2 * flow * (indoor - supply) %}
          {{ ([power, 0] | max) | round(0) }}


      # ----------------------------------------------------------
      # Temperature advantage
      # ----------------------------------------------------------

      - name: Crispy Delta T
        unique_id: crispy_delta_t
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_intake_temperature')
          }}
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float %}
          {{ (indoor - intake) | round(2) }}


      # ----------------------------------------------------------
      # Effective target
      #
      # Heatwave mode and forecast risk can lower the target. They do not
      # stack: the strongest policy wins, capped by the forecast package at
      # 1.0 C. Missing forecast data therefore degrades cleanly to zero.
      # ----------------------------------------------------------

      - name: Crispy Effective Target
        unique_id: crispy_effective_target
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {% set target = states('input_number.crispy_target') | float(19.5) %}
          {% set heatwave = 0.5 if is_state('input_boolean.crispy_heatwave_mode', 'on') else 0 %}
          {% set predictive = states('sensor.crispy_predictive_target_offset') | float(0) if is_state('binary_sensor.crispy_forecast_fresh', 'on') and is_state('input_boolean.crispy_predictive_control', 'on') else 0 %}
          {% set offset = [heatwave, predictive] | max %}
          {{ (target - offset) | round(1) }}

      - name: Crispy Predictive Aggression
        unique_id: crispy_predictive_aggression
        icon: mdi:chart-timeline-variant-shimmer
        state: >-
          {% set enabled = is_state('input_boolean.crispy_predictive_control', 'on') %}
          {% set risk = states('sensor.crispy_forecast_heat_risk') %}
          {% set window_valid = has_value('sensor.crispy_forecast_current_window_hours') %}
          {% set window = states('sensor.crispy_forecast_current_window_hours') | float(0) %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set gap = [indoor - target, 0] | max %}
          {% set required_rate = gap / ([window, 0.5] | max) %}
          {% if not enabled or not is_state('binary_sensor.crispy_forecast_fresh', 'on') or risk not in ['low', 'moderate', 'high', 'extreme'] or not window_valid %}
            off
          {% elif gap <= 0 %}
            satisfied
          {% elif required_rate >= 0.30 or (risk == 'extreme' and window <= 4) %}
            urgent
          {% elif required_rate >= 0.12 or risk in ['high', 'extreme'] %}
            aggressive
          {% else %}
            normal
          {% endif %}

      - name: Crispy Forecast Status
        unique_id: crispy_forecast_status
        icon: mdi:weather-clock
        state: >-
          {% set stamp = as_timestamp(states('sensor.crispy_weather_hourly'), 0) %}
          {% set age = (as_timestamp(now()) - stamp) / 60 %}
          {% if stamp <= 0 %}
            No forecast · live control only
          {% elif age < 0 %}
            Invalid forecast timestamp · live control only
          {% elif age >= 90 %}
            Stale forecast · {{ age | int }} min old · live control only
          {% elif not is_state('binary_sensor.crispy_forecast_fresh', 'on') %}
            No usable near-term forecast · live control only
          {% elif not is_state('input_boolean.crispy_predictive_control', 'on') %}
            Fresh · {{ age | int }} min old · predictive disabled
          {% else %}
            Fresh · {{ age | int }} min old
          {% endif %}

      - name: Crispy Target Policy
        unique_id: crispy_target_policy
        icon: mdi:bullseye-arrow
        state: >-
          {% set base = states('input_number.crispy_target') | float(19.5) %}
          {% set effective = states('sensor.crispy_effective_target') | float(base) %}
          {% set risk = states('sensor.crispy_forecast_heat_risk') %}
          {% if effective < base and risk in ['high', 'extreme'] and is_state('binary_sensor.crispy_forecast_fresh', 'on') and is_state('input_boolean.crispy_predictive_control', 'on') %}
            Predictive pre-cool · {{ risk | upper }} risk · −{{ (base - effective) | round(1) }}°C
          {% elif effective < base %}
            Heatwave pre-cool · −{{ (base - effective) | round(1) }}°C
          {% else %}
            Standard target
          {% endif %}


      # ----------------------------------------------------------
      # Airflow
      # ----------------------------------------------------------

      - name: Crispy Supply Airflow
        unique_id: crispy_supply_airflow
        unit_of_measurement: "m³/h"
        state_class: measurement
        availability: >-
          {{ has_value('sensor.crispy_hrc_supply_flow') }}
        state: >-
          {{
            (
              states('sensor.crispy_hrc_supply_flow')
              | float * 3.6
            ) | round(0)
          }}

      - name: Crispy Exhaust Airflow
        unique_id: crispy_exhaust_airflow
        unit_of_measurement: "m³/h"
        state_class: measurement
        availability: >-
          {{ has_value('sensor.crispy_hrc_exhaust_flow') }}
        state: >-
          {{
            (
              states('sensor.crispy_hrc_exhaust_flow')
              | float * 3.6
            ) | round(0)
          }}

      - name: Crispy Airflow Difference
        unique_id: crispy_airflow_difference
        unit_of_measurement: "m³/h"
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_supply_flow')
            and has_value('sensor.crispy_hrc_exhaust_flow')
          }}
        state: >-
          {% set supply = states('sensor.crispy_hrc_supply_flow') | float %}
          {% set exhaust = states('sensor.crispy_hrc_exhaust_flow') | float %}
          {{ ((supply - exhaust) * 3.6) | round(0) }}


      # ----------------------------------------------------------
      # Bypass / duct delivery effectiveness
      #
      # 100% roughly means supply reaches intake temperature.
      # It is a diagnostic metric, not official Orcon efficiency.
      # ----------------------------------------------------------

      - name: Crispy Delivery Effectiveness
        unique_id: crispy_delivery_effectiveness
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_intake_temperature')
            and has_value('sensor.crispy_hrc_supply_temperature')
            and
            (
              states('sensor.crispy_hrc_indoor_temperature') | float
              -
              states('sensor.crispy_hrc_intake_temperature') | float
            ) > 0.2
          }}
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float %}
          {% set available = indoor - intake %}
          {% set delivered = indoor - supply %}
          {% set efficiency = delivered / available * 100 %}
          {{ ([[efficiency, 0] | max, 150] | min) | round(0) }}

      - name: Crispy Heat Soak
        unique_id: crispy_heat_soak
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_intake_temperature')
            and has_value('sensor.crispy_hrc_supply_temperature')
          }}
        state: >-
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float %}
          {{ (supply - intake) | round(2) }}


      # ----------------------------------------------------------
      # Dew point
      # Magnus approximation
      # ----------------------------------------------------------

      - name: Crispy Indoor Dew Point
        unique_id: crispy_indoor_dew_point
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_indoor_humidity')
          }}
        state: >-
          {% set t = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set raw_rh = states('sensor.crispy_hrc_indoor_humidity') | float %}
          {% set rh = ([[raw_rh, 1] | max, 100] | min) %}
          {% set gamma = log(rh / 100) + (17.62 * t) / (243.12 + t) %}
          {{ (243.12 * gamma / (17.62 - gamma)) | round(1) }}

      - name: Crispy Intake Dew Point
        unique_id: crispy_intake_dew_point
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_intake_temperature')
            and has_value('sensor.crispy_hrc_intake_humidity')
          }}
        state: >-
          {% set t = states('sensor.crispy_hrc_intake_temperature') | float %}
          {% set raw_rh = states('sensor.crispy_hrc_intake_humidity') | float %}
          {% set rh = ([[raw_rh, 1] | max, 100] | min) %}
          {% set gamma = log(rh / 100) + (17.62 * t) / (243.12 + t) %}
          {{ (243.12 * gamma / (17.62 - gamma)) | round(1) }}

      - name: Crispy Supply Dewpoint Margin
        unique_id: crispy_supply_dewpoint_margin
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_indoor_dew_point')
            and has_value('sensor.crispy_hrc_supply_temperature')
          }}
        state: >-
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float %}
          {% set dew = states('sensor.crispy_indoor_dew_point') | float %}
          {{ (supply - dew) | round(1) }}


      # ----------------------------------------------------------
      # Current session
      # ----------------------------------------------------------

      - name: Crispy Session Energy
        unique_id: crispy_session_energy
        unit_of_measurement: "kWh"
        state_class: measurement
        state: >-
          {% set now_energy = states('sensor.crispy_cooling_energy') | float(0) %}
          {% set start_energy = states('input_number.crispy_session_start_energy') | float(0) %}
          {{ ([now_energy - start_energy, 0] | max) | round(2) }}

      - name: Crispy Precool Drop
        unique_id: crispy_precool_drop
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {% set start = states('input_number.crispy_session_start_temp') | float(0) %}
          {% set current = states('sensor.crispy_hrc_indoor_temperature') | float(0) %}
          {% if start > 5 %}
            {{ (start - current) | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: Crispy Precool Progress
        unique_id: crispy_precool_progress
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set start = states('input_number.crispy_session_start_temp') | float(0) %}
          {% set current = states('sensor.crispy_hrc_indoor_temperature') | float(0) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% if start > target + 0.1 %}
            {% set progress = ((start - current) / (start - target)) * 100 %}
            {{ ([[progress, 0] | max, 100] | min) | round(0) }}
          {% else %}
            100
          {% endif %}


      # ----------------------------------------------------------
      # ETA
      # ----------------------------------------------------------

      - name: Crispy ETA Hours
        unique_id: crispy_eta_hours
        unit_of_measurement: h
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_indoor_rate')
            and
            (states('sensor.crispy_indoor_rate') | float) < -0.05
            and
            (states('sensor.crispy_hrc_indoor_temperature') | float)
              >
            (states('sensor.crispy_effective_target') | float)
          }}
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set target = states('sensor.crispy_effective_target') | float %}
          {% set rate = states('sensor.crispy_indoor_rate') | float %}
          {% set eta = (indoor - target) / (rate | abs) %}
          {{ eta | round(1) }}


      # ----------------------------------------------------------
      # Projections
      # ----------------------------------------------------------

      - name: Crispy 8h Projection
        unique_id: crispy_8h_projection
        unit_of_measurement: "kWh"
        state_class: measurement
        state: >-
          {{ (states('sensor.crispy_cooling_power') | float(0) * 8 / 1000) | round(1) }}

      - name: Crispy 12h Projection
        unique_id: crispy_12h_projection
        unit_of_measurement: "kWh"
        state_class: measurement
        state: >-
          {{ (states('sensor.crispy_cooling_power') | float(0) * 12 / 1000) | round(1) }}


      # ----------------------------------------------------------
      # Equivalent AC full-output runtime
      #
      # Thermal equivalence only.
      # ----------------------------------------------------------

      - name: Crispy AC Equivalent Today
        unique_id: crispy_ac_equivalent_today
        unit_of_measurement: h
        state_class: measurement
        state: >-
          {% set energy = states('sensor.crispy_cooling_today') | float(0) %}
          {% set capacity = states('input_number.crispy_ac_capacity_kw') | float(2.64) %}
          {{ (energy / capacity) | round(2) if capacity > 0 else 0 }}

      - name: Crispy AC Equivalent Tonight
        unique_id: crispy_ac_equivalent_tonight
        unit_of_measurement: h
        state_class: measurement
        state: >-
          {% set energy = states('sensor.crispy_cooling_tonight') | float(0) %}
          {% set capacity = states('input_number.crispy_ac_capacity_kw') | float(2.64) %}
          {{ (energy / capacity) | round(2) if capacity > 0 else 0 }}


      # ----------------------------------------------------------
      # Opportunity score
      #
      # Transparent:
      # 45 pts temperature advantage
      # 45 pts current cooling power
      # 10 pts intake falling
      # ----------------------------------------------------------

      - name: Crispy Opportunity Score
        unique_id: crispy_opportunity_score
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set delta = states('sensor.crispy_delta_t') | float(0) %}
          {% set power = states('sensor.crispy_cooling_power') | float(0) %}
          {% set intake_rate = states('sensor.crispy_intake_rate') | float(0) %}

          {% set delta_points = ([[delta * 9, 0] | max, 45] | min) %}
          {% set power_points = ([[power / 800 * 45, 0] | max, 45] | min) %}
          {% set trend_points = 10 if intake_rate < 0 else 0 %}

          {{ (delta_points + power_points + trend_points) | round(0) }}

      - name: Crispy Opportunity
        unique_id: crispy_opportunity
        icon: mdi:snowflake-check
        state: >-
          {% set score = states('sensor.crispy_opportunity_score') | float(0) %}
          {% if score >= 85 %}
            Excellent
          {% elif score >= 65 %}
            Very good
          {% elif score >= 45 %}
            Good
          {% elif score >= 25 %}
            Marginal
          {% else %}
            Poor
          {% endif %}


      # ----------------------------------------------------------
      # Outlook
      # ----------------------------------------------------------

      - name: Crispy Morning Outlook
        unique_id: crispy_morning_outlook
        icon: mdi:weather-night
        state: >-
          {% set delta = states('sensor.crispy_delta_t') | float(0) %}
          {% set power = states('sensor.crispy_cooling_power') | float(0) %}
          {% set indoor_rate = states('sensor.crispy_indoor_rate') | float(0) %}
          {% set intake_rate = states('sensor.crispy_intake_rate') | float(0) %}

          {% if delta < 0.5 %}
            Cooling window closed
          {% elif intake_rate <= -0.5 and indoor_rate < 0 %}
            Conditions improving fast
          {% elif intake_rate <= -0.15 %}
            Intake still getting colder
          {% elif intake_rate >= 0.3 %}
            Cooling window closing
          {% elif indoor_rate <= -0.3 and power >= 300 %}
            Apartment cooling strongly
          {% elif indoor_rate < -0.1 %}
            Apartment cooling steadily
          {% else %}
            Conditions stable
          {% endif %}


      # ----------------------------------------------------------
      # Absolute humidity / moisture
      # ----------------------------------------------------------

      - name: Crispy Indoor Absolute Humidity
        unique_id: crispy_indoor_absolute_humidity
        unit_of_measurement: "g/m³"
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_indoor_humidity')
          }}
        state: >-
          {% set t = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set rh = states('sensor.crispy_hrc_indoor_humidity') | float %}
          {% set svp = 6.112 * (2.718281828 ** ((17.67 * t) / (t + 243.5))) %}
          {% set vap = (rh / 100) * svp %}
          {{ (216.7 * vap / (273.15 + t)) | round(2) }}

      - name: Crispy Intake Absolute Humidity
        unique_id: crispy_intake_absolute_humidity
        unit_of_measurement: "g/m³"
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_intake_temperature')
            and has_value('sensor.crispy_hrc_intake_humidity')
          }}
        state: >-
          {% set t = states('sensor.crispy_hrc_intake_temperature') | float %}
          {% set rh = states('sensor.crispy_hrc_intake_humidity') | float %}
          {% set svp = 6.112 * (2.718281828 ** ((17.67 * t) / (t + 243.5))) %}
          {% set vap = (rh / 100) * svp %}
          {{ (216.7 * vap / (273.15 + t)) | round(2) }}

      - name: Crispy Drying Advantage
        unique_id: crispy_drying_advantage
        unit_of_measurement: "g/m³"
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_indoor_absolute_humidity')
            and has_value('sensor.crispy_intake_absolute_humidity')
          }}
        state: >-
          {% set inside = states('sensor.crispy_indoor_absolute_humidity') | float %}
          {% set intake = states('sensor.crispy_intake_absolute_humidity') | float %}
          {{ (inside - intake) | round(2) }}

      # ----------------------------------------------------------
      # Independent fan demands
      # ----------------------------------------------------------

      - name: Crispy Base Thermal Demand
        unique_id: crispy_base_thermal_demand
        icon: mdi:snowflake-thermometer
        state: >-
          {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
          {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set delta = indoor - intake %}
          {% set strategy = states('input_select.crispy_control_strategy') %}
          {% if not enabled or not healthy or intake < guard or indoor <= target %}
            none
          {% elif strategy == 'Full Send' %}
            {{ 'high' if delta > 0.2 else 'none' }}
          {% elif delta >= 3 %}
            high
          {% elif delta >= 1 %}
            medium
          {% elif delta >= 0.5 %}
            low
          {% else %}
            none
          {% endif %}

      - name: Crispy Predictive Thermal Demand
        unique_id: crispy_predictive_thermal_demand
        icon: mdi:weather-sunset-up
        state: >-
          {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
          {% set predictive = is_state('input_boolean.crispy_predictive_control', 'on') %}
          {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
          {% set strategy = states('input_select.crispy_control_strategy') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set aggression = states('sensor.crispy_predictive_aggression') %}
          {% set delta = indoor - intake %}
          {% if
            not enabled
            or not predictive
            or not is_state('binary_sensor.crispy_forecast_fresh', 'on')
            or not healthy
            or strategy != 'Auto'
            or intake < guard
            or indoor <= target
            or delta < 0.5
          %}
            none
          {% elif aggression == 'urgent' %}
            high
          {% elif aggression == 'aggressive' %}
            medium
          {% elif aggression == 'normal' %}
            low
          {% else %}
            none
          {% endif %}

      - name: Crispy Thermal Momentum
        unique_id: crispy_thermal_momentum
        icon: mdi:chart-timeline-variant-shimmer
        availability: >-
          {{ has_value('sensor.crispy_indoor_fast_rate') }}
        state: >-
          {% set rate = states('sensor.crispy_indoor_fast_rate') | float(0) %}
          {% if rate <= -0.10 %}
            cooling_fast
          {% elif rate <= -0.03 %}
            cooling
          {% elif rate < 0.04 %}
            stable
          {% elif rate < 0.10 %}
            warming
          {% else %}
            warming_fast
          {% endif %}

      - name: Crispy Recent Heat Gain
        unique_id: crispy_recent_heat_gain
        unit_of_measurement: "°C"
        icon: mdi:thermometer-chevron-up
        state_class: measurement
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_indoor_recent_low')
          }}
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(0) %}
          {% set low = states('sensor.crispy_indoor_recent_low') | float(indoor) %}
          {{ ([indoor - low, 0] | max) | round(2) }}

      - name: Crispy Thermal Momentum Demand
        unique_id: crispy_thermal_momentum_demand
        icon: mdi:weather-windy
        state: >-
          {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
          {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
          {% set confident = is_state('binary_sensor.crispy_momentum_confident', 'on') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set rate = states('sensor.crispy_indoor_fast_rate') | float(0) %}
          {% set delta = indoor - intake %}
          {% set pressure = is_state('input_boolean.crispy_thermal_pressure_active', 'on') %}
          {% set base = states('sensor.crispy_base_thermal_demand') %}
          {% if not enabled or not healthy or not confident or intake < guard or indoor <= target or delta < 0.5 %}
            none
          {% elif not pressure %}
            none
          {% elif rate >= 0.10 %}
            high
          {% elif rate >= -0.03 %}
            {% if base in ['medium', 'high'] %}
              high
            {% elif base == 'low' %}
              medium
            {% else %}
              none
            {% endif %}
          {% else %}
            none
          {% endif %}

      - name: Crispy Momentum Diagnostic
        unique_id: crispy_momentum_diagnostic
        icon: mdi:stethoscope
        state: >-
          {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
          {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
          {% set plausible = is_state('binary_sensor.crispy_momentum_inputs_plausible', 'on') %}
          {% set confident = is_state('binary_sensor.crispy_momentum_confident', 'on') %}
          {% set pressure = is_state('input_boolean.crispy_thermal_pressure_active', 'on') %}
          {% set candidate = is_state('binary_sensor.crispy_thermal_pressure_candidate', 'on') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set rate = states('sensor.crispy_indoor_fast_rate') | float(0) %}
          {% set delta = indoor - intake %}
          {% if not enabled %}
            Disabled · Crispy off
          {% elif not healthy %}
            Blocked · telemetry unhealthy
          {% elif not plausible %}
            Rejected · rate input implausible
          {% elif not confident %}
            {% set age = ((as_timestamp(now()) - as_timestamp(states.binary_sensor.crispy_momentum_inputs_plausible.last_changed)) / 60) | int(0) %}
            Learning {{ [[age, 0] | max, 5] | min }}/5 min
          {% elif intake < guard %}
            Blocked · intake below guard
          {% elif indoor <= target %}
            Blocked · target reached
          {% elif delta < 0.5 %}
            Blocked · cooling advantage low
          {% elif pressure and rate >= 0.10 %}
            Boost HIGH · fast warming
          {% elif pressure and rate >= -0.03 %}
            Boost active · thermal pressure
          {% elif pressure %}
            Cooling · boost suppressed
          {% elif candidate %}
            {% set age = ((as_timestamp(now()) - as_timestamp(states.binary_sensor.crispy_thermal_pressure_candidate.last_changed)) / 60) | int(0) %}
            Arming {{ [[age, 0] | max, 10] | min }}/10 min
          {% else %}
            Waiting · warming below +0.04°C/h
          {% endif %}

      - name: Crispy Recent Heat Gain Demand
        unique_id: crispy_recent_heat_gain_demand
        icon: mdi:home-thermometer-outline
        state: >-
          {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
          {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set gain = states('sensor.crispy_recent_heat_gain') | float(0) %}
          {% set delta = indoor - intake %}
          {% set base = states('sensor.crispy_base_thermal_demand') %}
          {% if not enabled or not healthy or intake < guard or indoor <= target + 0.3 or delta < 0.5 %}
            none
          {% elif gain >= 1.0 %}
            high
          {% elif gain >= 0.5 %}
            {% if base == 'medium' %}
              high
            {% elif base == 'low' %}
              medium
            {% elif base == 'high' %}
              high
            {% else %}
              low
            {% endif %}
          {% else %}
            none
          {% endif %}

      - name: Crispy Thermal Demand
        unique_id: crispy_thermal_demand
        icon: mdi:snowflake-thermometer
        state: >-
          {% set demands = [
            states('sensor.crispy_base_thermal_demand'),
            states('sensor.crispy_predictive_thermal_demand'),
            states('sensor.crispy_thermal_momentum_demand'),
            states('sensor.crispy_recent_heat_gain_demand')
          ] %}
          {% if 'high' in demands %}
            high
          {% elif 'medium' in demands %}
            medium
          {% elif 'low' in demands %}
            low
          {% else %}
            none
          {% endif %}

      - name: Crispy Cruise Demand
        unique_id: crispy_cruise_demand
        icon: mdi:fan-speed-1
        state: >-
          {% set thermal = states('sensor.crispy_thermal_demand') %}
          {% set aggression = states('sensor.crispy_predictive_aggression') %}
          {% if thermal not in ['low', 'medium', 'high'] %}
            none
          {% elif aggression == 'urgent' and thermal in ['medium', 'high'] %}
            medium
          {% else %}
            low
          {% endif %}

      - name: Crispy Applied Thermal Demand
        unique_id: crispy_applied_thermal_demand
        icon: mdi:fan-auto
        state: >-
          {% set thermal = states('sensor.crispy_thermal_demand') %}
          {% set phase = states('input_select.crispy_thermal_phase') %}
          {% set strategy = states('input_select.crispy_control_strategy') %}
          {% if is_state('binary_sensor.crispy_cooling_watchdog_blocked', 'on') %}
            none
          {% elif thermal not in ['low', 'medium', 'high'] %}
            none
          {% elif strategy == 'Full Send' %}
            {{ thermal }}
          {% elif phase == 'cruise' %}
            {{ states('sensor.crispy_cruise_demand') }}
          {% elif phase == 'attack' %}
            {{ thermal }}
          {% else %}
            none
          {% endif %}

      - name: Crispy Moisture Demand
        unique_id: crispy_moisture_demand
        icon: mdi:water-alert
        state: >-
          {% if not is_state('input_boolean.crispy_moisture_active', 'on') %}
            none
          {% else %}
            {% set rh = states('sensor.crispy_hrc_indoor_humidity') | float(0) %}
            {% set advantage = states('sensor.crispy_drying_advantage') | float(0) %}
            {% set rate = states('sensor.crispy_indoor_humidity_rate') | float(0) %}
            {% if rh >= 65 or advantage >= 1.5 or rate >= 5 %}
              high
            {% else %}
              medium
            {% endif %}
          {% endif %}

      - name: Crispy Laundry Demand
        unique_id: crispy_laundry_demand
        icon: mdi:hanger
        state: >-
          {% if not is_state('input_boolean.crispy_laundry_mode', 'on') %}
            none
          {% elif not has_value('sensor.crispy_drying_advantage') %}
            none
          {% else %}
            {% set advantage = states('sensor.crispy_drying_advantage') | float(0) %}
            {% if advantage >= 1.0 %}
              high
            {% elif advantage >= 0.5 %}
              medium
            {% elif advantage >= 0.2 %}
              low
            {% else %}
              none
            {% endif %}
          {% endif %}

      - name: Crispy Raw Fan Demand
        unique_id: crispy_raw_fan_demand
        icon: mdi:fan-chevron-up
        state: >-
          {% set demands = [
            states('sensor.crispy_applied_thermal_demand'),
            states('sensor.crispy_moisture_demand'),
            states('sensor.crispy_laundry_demand')
          ] %}
          {% if 'high' in demands %}
            high
          {% elif 'medium' in demands %}
            medium
          {% elif 'low' in demands %}
            low
          {% else %}
            none
          {% endif %}

      # LOW remains an internal demand level, never an automatic RF command.
      # No boost / Guest Quiet releases our remote to AUTO immediately. Only
      # HIGH -> MEDIUM retains the ordinary boost step-down dwell.
      - name: Crispy Requested Fan Mode
        unique_id: crispy_requested_fan_mode
        icon: mdi:fan-auto
        state: >-
          {% set held = states('input_select.crispy_held_fan_demand') %}
          {% set raw = states('sensor.crispy_raw_fan_demand') %}
          {% set quiet = is_state('input_boolean.crispy_quiet_mode', 'on') %}
          {% if quiet or raw not in ['medium', 'high'] %}
            none
          {% elif held in ['medium', 'high'] %}
            {{ held }}
          {% else %}
            none
          {% endif %}

      # Numeric demand telemetry for graphs: 0=NONE, 1=LOW, 2=MEDIUM, 3=HIGH.
      - name: Crispy Base Thermal Demand Level
        unique_id: crispy_base_thermal_demand_level
        state_class: measurement
        icon: mdi:snowflake-thermometer
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_base_thermal_demand'), 0) }}

      - name: Crispy Predictive Thermal Demand Level
        unique_id: crispy_predictive_thermal_demand_level
        state_class: measurement
        icon: mdi:weather-sunset-up
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_predictive_thermal_demand'), 0) }}

      - name: Crispy Thermal Momentum Demand Level
        unique_id: crispy_thermal_momentum_demand_level
        state_class: measurement
        icon: mdi:trending-up
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_thermal_momentum_demand'), 0) }}

      - name: Crispy Recent Heat Gain Demand Level
        unique_id: crispy_recent_heat_gain_demand_level
        state_class: measurement
        icon: mdi:thermometer-chevron-up
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_recent_heat_gain_demand'), 0) }}

      - name: Crispy Thermal Demand Level
        unique_id: crispy_thermal_demand_level
        state_class: measurement
        icon: mdi:snowflake-thermometer
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_thermal_demand'), 0) }}

      - name: Crispy Applied Thermal Demand Level
        unique_id: crispy_applied_thermal_demand_level
        state_class: measurement
        icon: mdi:fan-auto
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_applied_thermal_demand'), 0) }}

      - name: Crispy Moisture Demand Level
        unique_id: crispy_moisture_demand_level
        state_class: measurement
        icon: mdi:water-alert
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_moisture_demand'), 0) }}

      - name: Crispy Laundry Demand Level
        unique_id: crispy_laundry_demand_level
        state_class: measurement
        icon: mdi:hanger
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_laundry_demand'), 0) }}

      - name: Crispy Raw Fan Demand Level
        unique_id: crispy_raw_fan_demand_level
        state_class: measurement
        icon: mdi:fan
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_raw_fan_demand'), 0) }}

      - name: Crispy Held Fan Demand Level
        unique_id: crispy_held_fan_demand_level
        state_class: measurement
        icon: mdi:fan-auto
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('input_select.crispy_held_fan_demand'), 0) }}

      - name: Crispy Requested Fan Level
        unique_id: crispy_requested_fan_level
        state_class: measurement
        icon: mdi:fan-auto
        state: >-
          {{ {'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_requested_fan_mode'), 0) }}

      - name: Crispy Actual Fan Level
        unique_id: crispy_actual_fan_level
        state_class: measurement
        icon: mdi:fan
        state: >-
          {{ {'off':0, 'auto':0, 'none':0, 'low':1, 'medium':2, 'high':3}.get(states('sensor.crispy_hrc_fan_mode') | lower, 0) }}

      - name: Crispy Control Reason
        unique_id: crispy_control_reason
        icon: mdi:brain
        state: >-
          {% set req = states('sensor.crispy_requested_fan_mode') %}
          {% set raw = states('sensor.crispy_raw_fan_demand') %}
          {% set held = states('input_select.crispy_held_fan_demand') %}
          {% set applied = states('sensor.crispy_applied_thermal_demand') %}
          {% set phase = states('input_select.crispy_thermal_phase') %}
          {% set actual = states('sensor.crispy_hrc_fan_mode') %}
          {% set ranks = {'none': 0, 'low': 1, 'medium': 2, 'high': 3} %}
          {% set rr = ranks.get(req, 0) %}
          {% set ar = ranks.get(actual, 0) %}
          {% if is_state('input_boolean.crispy_quiet_mode','on') %}
            Guest quiet
          {% elif rr > 0 and is_state('input_boolean.crispy_external_override','on') and ar > rr %}
            External higher demand
          {% elif is_state('binary_sensor.crispy_cooling_watchdog_blocked','on') %}
            Cooling watchdog
          {% elif req == 'none' and is_state('binary_sensor.crispy_bypass_requested','on') %}
            Free cooling at AUTO
          {% elif req == 'none' %}
            Native AUTO ventilation
          {% elif ranks.get(held, 0) > ranks.get(raw, 0) and is_state('binary_sensor.crispy_bypass_requested','on') %}
            Thermal run-on
          {% elif ranks.get(held, 0) > ranks.get(raw, 0) %}
            Demand run-on
          {% elif raw != 'none' and states('sensor.crispy_laundry_demand') == raw %}
            Laundry drying
          {% elif raw != 'none' and states('sensor.crispy_moisture_demand') == raw %}
            Moisture control
          {% elif raw != 'none' and applied == raw %}
            {% if is_state('input_select.crispy_control_strategy','Full Send') %}
              Thermal full send
            {% elif phase == 'cruise' %}
              Thermal cruise
            {% elif
              states('sensor.crispy_predictive_thermal_demand') == states('sensor.crispy_thermal_demand')
              and states('sensor.crispy_predictive_aggression') in ['aggressive', 'urgent']
            %}
              Predictive attack
            {% else %}
              Thermal attack
            {% endif %}
          {% else %}
            Stock / no Crispy fan demand
          {% endif %}

      - name: Crispy Laundry Status
        unique_id: crispy_laundry_status
        icon: mdi:hanger
        state: >-
          {% if not is_state('input_boolean.crispy_laundry_mode','on') %}
            Off
          {% elif not is_state('input_boolean.crispy_laundry_wet_seen','on') %}
            Waiting for moisture rise
          {% else %}
            {% set d = states('sensor.crispy_laundry_demand') %}
            {% if d == 'high' %}Drying hard
            {% elif d == 'medium' %}Drying
            {% elif d == 'low' %}Finishing
            {% else %}Waiting for useful outside air
            {% endif %}
          {% endif %}

      # ----------------------------------------------------------
      # Controller expected state
      # ----------------------------------------------------------

      - name: Crispy Expected Mode
        unique_id: crispy_expected_mode
        icon: mdi:state-machine
        state: >-
          {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
          {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set requested = states('sensor.crispy_requested_fan_mode') %}
          {% set actual = states('sensor.crispy_hrc_fan_mode') %}
          {% set ranks = {'none': 0, 'low': 1, 'medium': 2, 'high': 3} %}
          {% set external = is_state('input_boolean.crispy_external_override','on') %}
          {% if not enabled %}
            off
          {% elif not healthy %}
            fault
          {% elif intake < guard %}
            frost
          {% elif requested not in ['medium','high'] %}
            {{ 'target' if indoor <= target else 'hold' }}
          {% elif external and ranks.get(actual,0) > ranks.get(requested,0) %}
            {{ actual }}
          {% elif requested in ['medium','high'] %}
            {{ requested }}
          {% elif indoor <= target %}
            target
          {% else %}
            hold
          {% endif %}


      # ----------------------------------------------------------
      # Main status
      # ----------------------------------------------------------

      - name: Crispy Status
        unique_id: crispy_status
        icon: mdi:snowflake
        state: >-
          {% set mode = states('sensor.crispy_expected_mode') %}
          {% set reason = states('sensor.crispy_control_reason') %}
          {% if mode == 'off' %}
            Disabled
          {% elif mode == 'fault' %}
            Sensor fault
          {% elif mode == 'frost' %}
            Cold intake guard
          {% elif reason == 'External higher demand' %}
            External {{ mode | upper }} preserved
          {% elif reason == 'Guest quiet' %}
            Guest quiet · native AUTO
          {% elif reason == 'Free cooling at AUTO' %}
            Free cooling · native AUTO
          {% elif reason == 'Cooling watchdog' %}
            {{ states('input_text.crispy_watchdog_reason') }} · thermal retry wait
          {% elif reason == 'Thermal run-on' %}
            Cooling run-on · {{ mode | upper }}
          {% elif reason == 'Demand run-on' %}
            Run-on · {{ mode | upper }}
          {% elif reason == 'Laundry drying' %}
            Laundry → {{ mode | upper }}
          {% elif reason == 'Moisture control' %}
            Moisture → {{ mode | upper }}
          {% elif reason == 'Thermal full send' %}
            FULL SEND → {{ mode | upper }}
          {% elif reason == 'Thermal cruise' %}
            CRUISE → {{ mode | upper }}
          {% elif reason == 'Predictive attack' %}
            PREDICTIVE ATTACK → {{ mode | upper }}
          {% elif reason == 'Thermal attack' %}
            ATTACK → {{ mode | upper }}
          {% elif mode == 'target' %}
            Target reached
          {% elif reason == 'Native AUTO ventilation' %}
            Native AUTO ventilation
          {% elif mode == 'high' %}
            Max free cooling
          {% elif mode == 'medium' %}
            Medium free cooling
          {% elif mode == 'low' %}
            Gentle free cooling
          {% else %}
            Heat recovery
          {% endif %}

      - name: Crispy Cooling Performance
        unique_id: crispy_cooling_performance
        icon: mdi:gauge
        state: >-
          {% set phase = states('input_select.crispy_thermal_phase') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float(99) %}
          {% set power = states('sensor.crispy_cooling_power') | float(0) %}
          {% if is_state('binary_sensor.crispy_cooling_watchdog_blocked', 'on') %}
            Blocked · {{ states('input_text.crispy_watchdog_reason') }}
          {% elif phase not in ['attack', 'cruise'] %}
            Idle
          {% elif not is_state('binary_sensor.crispy_hrc_bypass_open', 'on') %}
            Settling · waiting for bypass
          {% elif supply >= indoor - 0.1 %}
            Poor · supply not cooler
          {% elif power >= 300 %}
            Strong · {{ power | round(0) }} W
          {% elif power >= 100 %}
            Useful · {{ power | round(0) }} W
          {% elif power >= 20 %}
            Marginal · {{ power | round(0) }} W
          {% else %}
            Poor · {{ power | round(0) }} W
          {% endif %}


      # ----------------------------------------------------------
      # RF / data freshness
      # ----------------------------------------------------------

      - name: Crispy Data Age
        unique_id: crispy_data_age
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set a = (now_ts - as_timestamp(states.sensor.crispy_hrc_indoor_temperature.last_updated)) / 60 %}
          {% set b = (now_ts - as_timestamp(states.sensor.crispy_hrc_intake_temperature.last_updated)) / 60 %}
          {% set c = (now_ts - as_timestamp(states.sensor.crispy_hrc_supply_temperature.last_updated)) / 60 %}
          {% set d = (now_ts - as_timestamp(states.sensor.crispy_hrc_supply_flow.last_updated)) / 60 %}
          {% set e = (now_ts - as_timestamp(states.sensor.crispy_hrc_exhaust_flow.last_updated)) / 60 %}
          {{ ([a,b,c,d,e] | max) | round(1) }}

      - name: Crispy Controller Age
        unique_id: crispy_controller_age
        unit_of_measurement: min
        state_class: measurement
        state: >-
          {% set last = state_attr('automation.hrc_crispy_mode_v2', 'last_triggered') %}
          {% if last %}
            {{
              (
                (
                  as_timestamp(now())
                  -
                  as_timestamp(last)
                ) / 60
              ) | round(1)
            }}
          {% else %}
            9999
          {% endif %}


      # ----------------------------------------------------------
      # Last command feedback
      # ----------------------------------------------------------

      - name: Crispy Command Feedback
        unique_id: crispy_command_feedback
        icon: mdi:radio-tower
        state: >-
          {% set cmd = states('input_text.crispy_last_command') %}
          {% set fan = states('sensor.crispy_hrc_fan_mode') %}
          {% set bypass = is_state('binary_sensor.crispy_hrc_bypass_open', 'on') %}

          {% if cmd.startswith('HIGH') %}
            {{ 'Confirmed HIGH' if fan == 'high' else 'Waiting for HIGH' }}
          {% elif cmd.startswith('MEDIUM') %}
            {{ 'Confirmed MEDIUM' if fan == 'medium' else 'Waiting for MEDIUM' }}
          {% elif cmd.startswith('LOW') %}
            {{ 'Confirmed LOW' if fan == 'low' else 'Waiting for LOW' }}
          {% elif cmd.startswith('FAN AUTO') %}
            {{
              'Confirmed AUTO'
              if has_value('sensor.crispy_hrc_remaining_time')
              and states('sensor.crispy_hrc_remaining_time') | int(-1) == 0
              else 'Releasing fan override'
            }}
          {% elif cmd.startswith('BYPASS OPEN') %}
            {{ 'Confirmed OPEN' if bypass else 'Waiting for OPEN' }}
          {% elif cmd.startswith('BYPASS AUTO') %}
            AUTO command sent
          {% elif cmd.startswith('MAX CRISPY') %}
            {{ 'MAX confirmed' if fan == 'high' and bypass else 'MAX engaging' }}
          {% elif cmd.startswith('NORMAL') %}
            NORMAL command sent
          {% elif cmd | length > 0 %}
            {{ cmd }}
          {% else %}
            No command yet
          {% endif %}


  # ==============================================================
  # BINARY SENSORS
  # ==============================================================

  - binary_sensor:

      # Keep this gate in core so the optional weather package can be absent.
      # Receipt time alone is insufficient: require a usable near-term point.
      - name: Crispy Forecast Fresh
        unique_id: crispy_forecast_fresh
        state: >-
          {% set stamp = as_timestamp(states('sensor.crispy_weather_hourly'), 0) %}
          {% set current = as_timestamp(now()) %}
          {% set fc = state_attr('sensor.crispy_weather_hourly', 'forecast') or [] %}
          {% set ns = namespace(usable=false) %}
          {% for p in fc if p is mapping %}
            {% set time = as_timestamp(p.get('datetime'), 0) %}
            {% if current <= time <= current + 3600 and is_number(p.get('temperature')) %}
              {% set ns.usable = true %}
            {% endif %}
          {% endfor %}
          {{ stamp > 0 and 0 <= current - stamp < 5400 and ns.usable }}

      - name: Crispy HRC Bypass Open
        unique_id: crispy_hrc_bypass_open
        device_class: opening
        availability: >-
          {{ states('binary_sensor.fan_32_142350_bypass_position') not in ['unknown', 'unavailable'] }}
        state: "{{ is_state('binary_sensor.fan_32_142350_bypass_position', 'on') }}"

      - name: Crispy HRC Remote Available
        unique_id: crispy_hrc_remote_available
        device_class: connectivity
        state: >-
          {% set remote = states('input_text.crispy_remote_entity') %}
          {{ remote.startswith('remote.') and states(remote) not in ['unknown', 'unavailable'] }}

      - name: Crispy Sensors Healthy
        unique_id: crispy_sensors_healthy
        device_class: connectivity
        state: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_intake_temperature')
            and has_value('sensor.crispy_hrc_supply_temperature')
            and has_value('sensor.crispy_hrc_supply_flow')
            and has_value('sensor.crispy_hrc_exhaust_flow')
            and is_state('binary_sensor.crispy_hrc_remote_available', 'on')
            and (states('sensor.crispy_data_age') | float(999)) < 10
          }}

      - name: Crispy Momentum Inputs Plausible
        unique_id: crispy_momentum_inputs_plausible
        icon: mdi:chart-line
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set fast = states('sensor.crispy_indoor_fast_rate') | float(99) %}
          {% set slow = states('sensor.crispy_indoor_rate') | float(99) %}
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_indoor_fast_rate')
            and has_value('sensor.crispy_indoor_rate')
            and 5 <= indoor <= 40
            and (fast | abs) <= 4
            and (slow | abs) <= 2
          }}

      # Five plausible minutes plus the ten-minute pressure arm means a new
      # post-restart boost cannot fire before the 15-minute derivative window
      # contains a useful amount of live data.
      - name: Crispy Momentum Confident
        unique_id: crispy_momentum_confident
        icon: mdi:shield-check-outline
        delay_on: "00:05:00"
        state: >-
          {{
            is_state('binary_sensor.crispy_sensors_healthy', 'on')
            and is_state('binary_sensor.crispy_momentum_inputs_plausible', 'on')
          }}

      # ATTACK may enter CRUISE only after ten sustained minutes of real,
      # delivered cooling. This replaces a blind timer with measured response.
      - name: Crispy Cruise Ready
        unique_id: crispy_cruise_ready
        icon: mdi:car-cruise-control
        delay_on: "00:10:00"
        state: >-
          {% set thermal = states('sensor.crispy_thermal_demand') %}
          {% set rate = states('sensor.crispy_indoor_fast_rate') | float(99) %}
          {% set power = states('sensor.crispy_cooling_power') | float(0) %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float(99) %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('input_select.crispy_control_strategy', 'Auto')
            and is_state('input_select.crispy_thermal_phase', 'attack')
            and thermal in ['medium', 'high']
            and is_state('binary_sensor.crispy_hrc_bypass_open', 'on')
            and is_state('binary_sensor.crispy_momentum_confident', 'on')
            and rate <= 0.03
            and power >= 50
            and supply <= indoor - 0.3
          }}

      # Compare against the measured pre-step-down trend. Stable temperature
      # while removing solar heat is success, not failed cooling.
      - name: Crispy Cruise Failing
        unique_id: crispy_cruise_failing
        icon: mdi:car-speed-limiter
        delay_on: "00:08:00"
        state: >-
          {% set rate = states('sensor.crispy_indoor_fast_rate') | float(99) %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float(99) %}
          {% set baseline = states('input_number.crispy_cruise_entry_rate') | float(0) %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('input_select.crispy_thermal_phase', 'cruise')
            and states('sensor.crispy_thermal_demand') in ['low', 'medium', 'high']
            and (
              (rate > 0.03 and rate >= baseline + 0.05)
              or supply >= indoor
              or states('sensor.crispy_hrc_supply_flow') | float(0) <= 5
              or not is_state('binary_sensor.crispy_hrc_bypass_open', 'on')
            )
          }}

      # Allow five continuous minutes of open-bypass ATTACK for duct settling.
      - name: Crispy Cooling Attempt Settled
        unique_id: crispy_cooling_attempt_settled
        delay_on: "00:05:00"
        state: >-
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('binary_sensor.crispy_sensors_healthy', 'on')
            and is_state('input_select.crispy_thermal_phase', 'attack')
            and is_state('binary_sensor.crispy_hrc_bypass_open', 'on')
            and states('sensor.crispy_hrc_fan_mode') in ['auto', 'low', 'medium', 'high']
          }}

      # No room-rate or arbitrary watt cutoff: even marginal heat removal can
      # offset solar gain. Require three more minutes of zero sensible cooling.
      - name: Crispy Cooling Delivery Failed
        unique_id: crispy_cooling_delivery_failed
        delay_on: "00:03:00"
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float(99) %}
          {{
            is_state('binary_sensor.crispy_cooling_attempt_settled', 'on')
            and is_state('binary_sensor.crispy_sensors_healthy', 'on')
            and (
              supply >= indoor
              or states('sensor.crispy_hrc_supply_flow') | float(0) <= 5
            )
          }}

      # Covers the missing-ack path that the open-bypass delivery watchdog
      # cannot observe. A closed/unreported bypass is only a cooling failure
      # when supply is not cooler or flow is negligible. Missing critical
      # telemetry is handled separately by the controller's fault path.
      - name: Crispy Bypass Open Failed
        unique_id: crispy_bypass_open_failed
        delay_on: "00:03:00"
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float(99) %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('binary_sensor.crispy_sensors_healthy', 'on')
            and is_state('binary_sensor.crispy_bypass_requested', 'on')
            and states('sensor.crispy_applied_thermal_demand') in ['low', 'medium', 'high']
            and not is_state('binary_sensor.crispy_hrc_bypass_open', 'on')
            and (supply >= indoor or states('sensor.crispy_hrc_supply_flow') | float(0) <= 5)
          }}

      # An explicit timer supports an early retry without self-referential
      # template latching. Restored expired timers are idle after HA startup.
      - name: Crispy Cooling Watchdog Blocked
        unique_id: crispy_cooling_watchdog_blocked
        icon: mdi:shield-alert-outline
        state: "{{ is_state('timer.crispy_cooling_retry', 'active') }}"

      - name: Crispy Cooling Retry Improved
        unique_id: crispy_cooling_retry_improved
        delay_on: "00:02:00"
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set baseline = states('input_number.crispy_watchdog_intake') | float(-40) %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('timer.crispy_cooling_retry', 'active')
            and is_state('binary_sensor.crispy_sensors_healthy', 'on')
            and intake <= baseline - 1.0
            and intake <= indoor - 0.5
            and intake >= states('input_number.crispy_min_intake') | float(12)
          }}

      - name: Crispy Thermal Pressure Candidate
        unique_id: crispy_thermal_pressure_candidate
        icon: mdi:thermometer-alert
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {% set rate = states('sensor.crispy_indoor_fast_rate') | float(0) %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('binary_sensor.crispy_momentum_confident', 'on')
            and not is_state('input_boolean.crispy_thermal_pressure_active', 'on')
            and intake >= guard
            and indoor > target
            and indoor - intake >= 0.5
            and rate >= 0.04
          }}

      - name: Crispy Fan Step Down Ready
        unique_id: crispy_fan_step_down_ready
        icon: mdi:fan-chevron-down
        delay_on: "00:12:00"
        state: >-
          {% set ranks = {'none':0, 'low':1, 'medium':2, 'high':3} %}
          {% set raw = states('sensor.crispy_raw_fan_demand') %}
          {% set held = states('input_select.crispy_held_fan_demand') %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and raw in ranks
            and held in ranks
            and ranks[raw] < ranks[held]
          }}

      # A live, deliberately small cooling margin used only to decide whether
      # a thermal run-on is still useful. Normal Auto demand keeps its stricter
      # 0.5 / 1 / 3 C ladder; this prevents that ladder's lower edge from
      # closing the bypass while a held fan request is still winding down.
      - name: Crispy Free Cooling Available
        unique_id: crispy_free_cooling_available
        icon: mdi:snowflake-check
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set guard = states('input_number.crispy_min_intake') | float(12) %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and is_state('binary_sensor.crispy_sensors_healthy', 'on')
            and intake >= guard
            and indoor > target
            and indoor - intake > 0.2
          }}

      # Abort a held fan request quickly when its extra speed is no longer
      # useful: either every demand has gone and intake air cannot cool, or an
      # open bypass is still delivering supply air at/above room temperature.
      # The short delay rejects transient telemetry updates without allowing a
      # stale HIGH request to spend the full twelve-minute dwell doing no work.
      - name: Crispy Stale Fan Hold
        unique_id: crispy_stale_fan_hold
        icon: mdi:fan-off
        delay_on: "00:00:30"
        state: >-
          {% set ranks = {'none':0, 'low':1, 'medium':2, 'high':3} %}
          {% set held = states('input_select.crispy_held_fan_demand') %}
          {% set raw = states('sensor.crispy_raw_fan_demand') %}
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(99) %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float(99) %}
          {% set no_cooling_source = raw == 'none' and is_state('binary_sensor.crispy_free_cooling_available', 'off') %}
          {% set not_delivering_cooling = is_state('binary_sensor.crispy_hrc_bypass_open', 'on') and supply >= indoor %}
          {{
            is_state('input_boolean.crispy_mode', 'on')
            and held in ranks
            and raw in ranks
            and ranks[held] > ranks[raw]
            and (no_cooling_source or not_delivering_cooling)
          }}

      # Raw thermal demand normally owns the bypass. During a useful fan
      # run-on, keep it open until the held request steps down; otherwise HIGH
      # could continue through the heat exchanger after the 0.5 C demand edge.
      - name: Crispy Bypass Requested
        unique_id: crispy_bypass_requested
        icon: mdi:valve-open
        state: >-
          {% set ranks = {'none':0, 'low':1, 'medium':2, 'high':3} %}
          {% set raw = states('sensor.crispy_raw_fan_demand') %}
          {% set held = states('input_select.crispy_held_fan_demand') %}
          {% set thermal = states('sensor.crispy_applied_thermal_demand') %}
          {{
            not is_state('binary_sensor.crispy_cooling_watchdog_blocked', 'on')
            and (
              thermal in ['low', 'medium', 'high']
              or (
                raw in ranks
                and held in ranks
                and ranks[held] > ranks[raw]
                and is_state('binary_sensor.crispy_free_cooling_available', 'on')
              )
            )
          }}

      - name: Crispy Free Cooling Active
        unique_id: crispy_free_cooling_active
        icon: mdi:snowflake
        availability: >-
          {{
            has_value('sensor.crispy_hrc_indoor_temperature')
            and has_value('sensor.crispy_hrc_supply_temperature')
            and has_value('sensor.crispy_hrc_supply_flow')
          }}
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float %}
          {% set supply = states('sensor.crispy_hrc_supply_temperature') | float %}
          {% set flow = states('sensor.crispy_hrc_supply_flow') | float %}
          {{
            is_state('binary_sensor.crispy_hrc_bypass_open', 'on')
            and supply < indoor
            and flow > 5
          }}

      - name: Crispy Controller Synced
        unique_id: crispy_controller_synced
        device_class: connectivity
        state: >-
          {% set expected = states('sensor.crispy_expected_mode') %}
          {% set actual = states('sensor.crispy_hrc_fan_mode') %}
          {% set bypass = is_state('binary_sensor.crispy_hrc_bypass_open', 'on') %}
          {% set bypass_required = is_state('binary_sensor.crispy_bypass_requested', 'on') %}
          {% set fan_release_pending = is_state('input_boolean.crispy_fan_override_active', 'on') %}

          {% if expected in ['high','medium'] %}
            {{ actual == expected and (not bypass_required or bypass) }}
          {% elif expected in ['target','hold'] %}
            {{ not fan_release_pending and (not bypass_required or bypass) }}
          {% elif expected in ['off','fault','frost'] %}
            {{ not fan_release_pending }}
          {% else %}
            true
          {% endif %}

      - name: Crispy AC Assist Recommended
        unique_id: crispy_ac_assist_recommended
        icon: mdi:air-conditioner
        state: >-
          {% set indoor = states('sensor.crispy_hrc_indoor_temperature') | float(0) %}
          {% set target = states('sensor.crispy_effective_target') | float(19.5) %}
          {% set rate = states('sensor.crispy_indoor_rate') | float(0) %}
          {% set power = states('sensor.crispy_cooling_power') | float(0) %}
          {% set mode = states('sensor.crispy_hrc_fan_mode') %}

          {{
            indoor > target + 1
            and
            (
              (mode == 'high' and rate > -0.15)
              or power < 150
            )
          }}


# ================================================================
# LOW-LEVEL RF SCRIPTS
# ================================================================

script:

  crispy_apply_bypass_policy:
    alias: Crispy Apply Independent Bypass Policy
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.crispy_bypass_requested
                state: "on"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ not is_state('binary_sensor.crispy_hrc_bypass_open', 'on') }}"
                then:
                  - action: script.crispy_send_bypass_open
                  - wait_template: "{{ is_state('binary_sensor.crispy_hrc_bypass_open', 'on') }}"
                    timeout: "00:00:10"
                    continue_on_timeout: true
        default:
          - if:
              - condition: state
                entity_id: input_boolean.crispy_bypass_forced
                state: "on"
            then:
              - action: script.crispy_send_bypass_auto

  crispy_diagnostic_snapshot:
    alias: Crispy Diagnostic Snapshot
    icon: mdi:clipboard-text-search-outline
    mode: single
    sequence:
      - variables:
          snapshot: |-
            Crispy diagnostic snapshot — {{ now().isoformat() }}

            Copy this snapshot from Home Assistant notifications. Missing optional entities are shown as unknown. This is a point-in-time capture; older decisions remain in Logbook.

            {% set entities = [
              'input_boolean.crispy_mode',
              'input_select.crispy_control_strategy',
              'input_boolean.crispy_quiet_mode',
              'input_boolean.crispy_predictive_control',
              'input_boolean.crispy_heatwave_mode',
              'input_number.crispy_target',
              'sensor.crispy_effective_target',
              'input_number.crispy_min_intake',
              'sensor.crispy_hrc_indoor_temperature',
              'sensor.crispy_hrc_intake_temperature',
              'sensor.crispy_hrc_supply_temperature',
              'sensor.crispy_hrc_supply_flow',
              'sensor.crispy_hrc_exhaust_flow',
              'sensor.crispy_hrc_indoor_humidity',
              'sensor.crispy_hrc_intake_humidity',
              'sensor.crispy_drying_advantage',
              'sensor.crispy_indoor_fast_rate',
              'sensor.crispy_cooling_power',
              'binary_sensor.crispy_sensors_healthy',
              'sensor.crispy_data_age',
              'input_select.crispy_thermal_phase',
              'input_number.crispy_cruise_entry_rate',
              'sensor.crispy_base_thermal_demand',
              'sensor.crispy_predictive_thermal_demand',
              'sensor.crispy_thermal_momentum_demand',
              'sensor.crispy_recent_heat_gain_demand',
              'sensor.crispy_applied_thermal_demand',
              'sensor.crispy_moisture_demand',
              'sensor.crispy_laundry_demand',
              'sensor.crispy_raw_fan_demand',
              'input_select.crispy_held_fan_demand',
              'sensor.crispy_requested_fan_mode',
              'sensor.crispy_expected_mode',
              'sensor.crispy_hrc_fan_mode',
              'sensor.crispy_hrc_remaining_time',
              'input_boolean.crispy_fan_override_active',
              'input_boolean.crispy_external_override',
              'input_select.crispy_external_latched_mode',
              'binary_sensor.crispy_bypass_requested',
              'binary_sensor.crispy_hrc_bypass_open',
              'input_boolean.crispy_bypass_forced',
              'binary_sensor.crispy_bypass_open_failed',
              'binary_sensor.crispy_cooling_delivery_failed',
              'binary_sensor.crispy_cooling_watchdog_blocked',
              'input_text.crispy_watchdog_reason',
              'timer.crispy_cooling_retry',
              'input_number.crispy_watchdog_intake',
              'binary_sensor.crispy_forecast_fresh',
              'sensor.crispy_forecast_status',
              'sensor.crispy_weather_hourly',
              'sensor.crispy_forecast_heat_risk',
              'sensor.crispy_forecast_current_window_hours',
              'sensor.crispy_control_reason',
              'input_text.crispy_last_command',
              'input_datetime.crispy_last_rf_fan_command',
              'input_datetime.crispy_last_decision_change',
              'input_text.crispy_decision_trace'
            ] %}
            {% for entity in entities %}
            - {{ entity }}: {{ states(entity) }}
            {% endfor %}

            Retry finishes: {{ state_attr('timer.crispy_cooling_retry', 'finishes_at') }}
      - action: persistent_notification.create
        data:
          notification_id: crispy_diagnostic_snapshot
          title: Crispy diagnostic snapshot
          message: "{{ snapshot }}"

  crispy_send_rf_command:
    alias: Crispy Send RAMSES Command
    mode: queued
    max: 10
    fields:
      command:
        name: Command
        required: true
        selector:
          text:
    sequence:
      - action: ramses_cc.send_command
        target:
          entity_id: "{{ states('input_text.crispy_remote_entity') }}"
        data:
          command: "{{ command }}"

  crispy_send_low_60:
    alias: Crispy Send LOW 60
    mode: restart
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "LOW 60 @ {{ now().strftime('%H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.crispy_last_rf_fan_command
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: script.crispy_send_rf_command
        data:
          command: low_60

  crispy_send_medium_60:
    alias: Crispy Send MEDIUM 60
    mode: restart
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "MEDIUM 60 @ {{ now().strftime('%H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.crispy_last_rf_fan_command
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: script.crispy_send_rf_command
        data:
          command: medium_60

  crispy_send_high_60:
    alias: Crispy Send HIGH 60
    mode: restart
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "HIGH 60 @ {{ now().strftime('%H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.crispy_last_rf_fan_command
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: script.crispy_send_rf_command
        data:
          command: high_60

  crispy_send_fan_auto:
    alias: Crispy Send Fan AUTO
    mode: restart
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "FAN AUTO @ {{ now().strftime('%H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.crispy_last_rf_fan_command
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: script.crispy_send_rf_command
        data:
          command: auto
      - wait_template: >-
          {{
            has_value('sensor.crispy_hrc_remaining_time')
            and states('sensor.crispy_hrc_remaining_time') | int(-1) == 0
          }}
        timeout: "00:00:10"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{
                not has_value('sensor.crispy_hrc_remaining_time')
                or states('sensor.crispy_hrc_remaining_time') | int(-1) != 0
              }}
        then:
          - action: script.crispy_send_rf_command
            data:
              command: auto
          - wait_template: >-
              {{
                has_value('sensor.crispy_hrc_remaining_time')
                and states('sensor.crispy_hrc_remaining_time') | int(-1) == 0
              }}
            timeout: "00:00:10"
            continue_on_timeout: true
      # Keep ownership latched if both attempts fail. The controller heartbeat
      # will retry AUTO instead of silently abandoning a live timed override.
      - if:
          - condition: template
            value_template: >-
              {{
                has_value('sensor.crispy_hrc_remaining_time')
                and states('sensor.crispy_hrc_remaining_time') | int(-1) == 0
              }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.crispy_fan_override_active

  crispy_send_bypass_open:
    alias: Crispy Send Bypass OPEN
    mode: restart
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "BYPASS OPEN @ {{ now().strftime('%H:%M:%S') }}"
      - action: script.crispy_send_rf_command
        data:
          command: bypass_open
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.crispy_bypass_forced

  crispy_send_bypass_auto:
    alias: Crispy Send Bypass AUTO
    mode: restart
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "BYPASS AUTO @ {{ now().strftime('%H:%M:%S') }}"
      - action: script.crispy_send_rf_command
        data:
          command: bypass_auto
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_bypass_forced


  # --------------------------------------------------------------
  # Manual overrides
  #
  # These disable Crispy first so automatic control doesn't fight
  # the manual command.
  # --------------------------------------------------------------

  crispy_manual_low:
    alias: Crispy Manual LOW
    icon: mdi:fan-speed-1
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_last_auto_mode
        data:
          option: manual
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_fan_override_active
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_mode
      - delay: "00:00:02"
      - action: script.crispy_send_low_60

  crispy_manual_medium:
    alias: Crispy Manual MEDIUM
    icon: mdi:fan-speed-2
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_last_auto_mode
        data:
          option: manual
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_fan_override_active
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_mode
      - delay: "00:00:02"
      - action: script.crispy_send_medium_60

  crispy_manual_high:
    alias: Crispy Manual HIGH
    icon: mdi:fan-speed-3
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_last_auto_mode
        data:
          option: manual
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_fan_override_active
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_mode
      - delay: "00:00:02"
      - action: script.crispy_send_high_60

  crispy_manual_bypass_open:
    alias: Crispy Manual Bypass OPEN
    icon: mdi:valve-open
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_mode
      - delay: "00:00:02"
      - action: script.crispy_send_bypass_open
      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_last_auto_mode
        data:
          option: manual

  crispy_manual_bypass_auto:
    alias: Crispy Manual Bypass AUTO
    icon: mdi:valve
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_mode
      - delay: "00:00:02"
      - action: script.crispy_send_bypass_auto
      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_last_auto_mode
        data:
          option: manual


  # --------------------------------------------------------------
  # Timed Guest Quiet
  # --------------------------------------------------------------

  crispy_guest_quiet_start:
    alias: Crispy Guest Quiet - Start
    icon: mdi:timer-outline
    mode: restart
    fields:
      duration:
        name: Duration
        required: true
        example: "04:00:00"
        default: "04:00:00"
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.crispy_quiet_timed
      - action: timer.start
        target:
          entity_id: timer.crispy_guest_quiet
        data:
          duration: "{{ duration | default('04:00:00', true) }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.crispy_quiet_mode

  crispy_guest_quiet_2h:
    alias: Crispy Guest Quiet - 2 hours
    icon: mdi:timer-outline
    sequence:
      - action: script.crispy_guest_quiet_start
        data:
          duration: "02:00:00"

  crispy_guest_quiet_4h:
    alias: Crispy Guest Quiet - 4 hours
    icon: mdi:timer-outline
    sequence:
      - action: script.crispy_guest_quiet_start
        data:
          duration: "04:00:00"

  crispy_guest_quiet_6h:
    alias: Crispy Guest Quiet - 6 hours
    icon: mdi:timer-outline
    sequence:
      - action: script.crispy_guest_quiet_start
        data:
          duration: "06:00:00"

  crispy_guest_quiet_toggle:
    alias: Crispy Guest Quiet - Toggle (4h default)
    icon: mdi:volume-low
    mode: restart
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.crispy_quiet_mode
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_quiet_mode
        default:
          - action: script.crispy_guest_quiet_4h


  # --------------------------------------------------------------
  # Macros
  # --------------------------------------------------------------

  crispy_max:
    alias: Crispy MAX
    icon: mdi:snowflake-alert
    mode: restart
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.crispy_target
        data:
          value: 19

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.crispy_quiet_mode
            - input_boolean.crispy_quiet_timed
            - input_boolean.crispy_heatwave_mode

      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_control_strategy
        data:
          option: "Full Send"

      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "MAX CRISPY @ {{ now().strftime('%H:%M:%S') }}"

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.crispy_mode

  crispy_normal:
    alias: Crispy NORMAL
    icon: mdi:home-thermometer
    mode: restart
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_mode

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.crispy_quiet_mode
            - input_boolean.crispy_quiet_timed
            - input_boolean.crispy_heatwave_mode
            - input_boolean.crispy_laundry_mode
            - input_boolean.crispy_laundry_wet_seen

      - action: input_select.select_option
        target:
          entity_id: input_select.crispy_control_strategy
        data:
          option: "Auto"

      - delay: "00:00:01"

      - action: script.crispy_send_bypass_auto

      - action: input_text.set_value
        target:
          entity_id: input_text.crispy_last_command
        data:
          value: "NORMAL @ {{ now().strftime('%H:%M:%S') }}"


# ================================================================
# AUTOMATIONS
# ================================================================

automation:

  # --------------------------------------------------------------
  # Snapshot beginning of each Crispy session
  # --------------------------------------------------------------

  - id: crispy_session_snapshot
    alias: Crispy - Snapshot Session Start
    mode: restart

    triggers:
      - trigger: state
        entity_id: input_boolean.crispy_mode
        from: "off"
        to: "on"

    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.crispy_session_start_temp
        data:
          value: >-
            {{ states('sensor.crispy_hrc_indoor_temperature') | float(0) }}

      - action: input_number.set_value
        target:
          entity_id: input_number.crispy_session_start_energy
        data:
          value: >-
            {{ states('sensor.crispy_cooling_energy') | float(0) }}


  # --------------------------------------------------------------
  # TIMED GUEST QUIET LIFECYCLE
  #
  # A manual entity toggle remains indefinite. Dashboard actions use the
  # timer; turning Quiet off early cancels it. Startup reconciliation covers
  # a timer that expired while Home Assistant was unavailable.
  # --------------------------------------------------------------

  - id: crispy_guest_quiet_lifecycle
    alias: Crispy - Guest Quiet Lifecycle
    mode: restart

    triggers:
      - trigger: homeassistant
        event: start
        id: startup

      - trigger: state
        entity_id: input_boolean.crispy_quiet_mode
        from: "on"
        to: "off"
        id: disabled

      - trigger: state
        entity_id: timer.crispy_guest_quiet
        from: "active"
        to: "idle"
        id: timer_idle

      - trigger: state
        entity_id: timer.crispy_guest_quiet
        from: "paused"
        to: "idle"
        id: timer_idle

    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:15"

      - choose:
          - conditions:
              - condition: trigger
                id: startup
              - condition: state
                entity_id: input_boolean.crispy_quiet_timed
                state: "on"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('timer.crispy_guest_quiet') in ['active', 'paused'] }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.crispy_quiet_mode
                else:
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        - input_boolean.crispy_quiet_timed
                        - input_boolean.crispy_quiet_mode

          - conditions:
              - condition: trigger
                id: disabled
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_quiet_timed
              - action: timer.cancel
                target:
                  entity_id: timer.crispy_guest_quiet

          - conditions:
              - condition: trigger
                id: timer_idle
              - condition: state
                entity_id: input_boolean.crispy_quiet_timed
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.crispy_quiet_timed
                    - input_boolean.crispy_quiet_mode


  # --------------------------------------------------------------
  # THERMAL CONTROL PHASE
  #
  # ATTACK applies the full thermal request. CRUISE deliberately tests
  # native AUTO (or MEDIUM for an urgent window). RELEASE drains a timed command
  # to fan AUTO. Full Send never enters CRUISE.
  # --------------------------------------------------------------

  - id: crispy_thermal_phase_manager
    alias: Crispy - Thermal Phase Manager
    mode: restart

    triggers:
      - trigger: homeassistant
        event: start
        id: startup

      - trigger: state
        entity_id:
          - input_boolean.crispy_mode
          - input_boolean.crispy_predictive_control
          - input_boolean.crispy_fan_override_active
          - input_select.crispy_control_strategy
          - sensor.crispy_thermal_demand
          - sensor.crispy_moisture_demand
          - sensor.crispy_laundry_demand
          - binary_sensor.crispy_cruise_ready
          - binary_sensor.crispy_cruise_failing
          - binary_sensor.crispy_cooling_watchdog_blocked
          - binary_sensor.crispy_sensors_healthy
        id: state

      - trigger: time_pattern
        minutes: "/1"
        id: reconcile

    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:25"

      - variables:
          current: "{{ states('input_select.crispy_thermal_phase') }}"
          thermal: "{{ states('sensor.crispy_thermal_demand') }}"
          nonthermal: >-
            {% set demands = [states('sensor.crispy_moisture_demand'), states('sensor.crispy_laundry_demand')] %}
            {{ 'active' if 'low' in demands or 'medium' in demands or 'high' in demands else 'none' }}
          owned: "{{ is_state('input_boolean.crispy_fan_override_active', 'on') }}"

      # Keep the transition calculation separate so the variables above are
      # already in scope on every supported Home Assistant release.
      - variables:
          next_phase: >-
            {% set enabled = is_state('input_boolean.crispy_mode', 'on') %}
            {% set healthy = is_state('binary_sensor.crispy_sensors_healthy', 'on') %}
            {% set intake = states('sensor.crispy_hrc_intake_temperature') | float(99) %}
            {% set guard = states('input_number.crispy_min_intake') | float(12) %}
            {% set strategy = states('input_select.crispy_control_strategy') %}
            {% set ready = is_state('binary_sensor.crispy_cruise_ready', 'on') %}
            {% set failing = is_state('binary_sensor.crispy_cruise_failing', 'on') %}
            {% set blocked = is_state('binary_sensor.crispy_cooling_watchdog_blocked', 'on') %}
            {% if not enabled or not healthy or intake < guard %}
              {{ 'release' if current in ['attack', 'cruise', 'release'] and owned and nonthermal == 'none' else 'idle' }}
            {% elif blocked %}
              release
            {% elif thermal in ['low', 'medium', 'high'] %}
              {% if strategy == 'Full Send' %}
                attack
              {% elif current == 'cruise' and not failing %}
                cruise
              {% elif ready %}
                cruise
              {% else %}
                attack
              {% endif %}
            {% elif current in ['attack', 'cruise', 'release'] and owned and nonthermal == 'none' %}
              release
            {% else %}
              idle
            {% endif %}

      - if:
          - condition: template
            value_template: >-
              {{ next_phase in ['idle', 'attack', 'cruise', 'release'] and next_phase != current }}
        then:
          - if:
              - condition: template
                value_template: "{{ next_phase == 'cruise' }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.crispy_cruise_entry_rate
                data:
                  value: "{{ [[states('sensor.crispy_indoor_fast_rate') | float(0), -4] | max, 4] | min }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.crispy_thermal_phase
            data:
              option: "{{ next_phase }}"


  # --------------------------------------------------------------
  # DELIVERED-COOLING RETRY
  # The timer is the lockout source of truth. Moisture/laundry demand is not
  # blocked; only the applied thermal demand is suppressed during this wait.
  # --------------------------------------------------------------

  - id: crispy_cooling_watchdog_retry
    alias: Crispy - Cooling Watchdog Retry
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: binary_sensor.crispy_cooling_delivery_failed
        to: "on"
        id: failed
      - trigger: state
        entity_id: binary_sensor.crispy_bypass_open_failed
        to: "on"
        id: failed
      - trigger: state
        entity_id: binary_sensor.crispy_cooling_retry_improved
        to: "on"
        id: improved
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: failed
              - condition: template
                value_template: >-
                  {{ is_state('binary_sensor.crispy_cooling_delivery_failed', 'on')
                     or is_state('binary_sensor.crispy_bypass_open_failed', 'on') }}
              - condition: state
                entity_id: timer.crispy_cooling_retry
                state: idle
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.crispy_watchdog_reason
                data:
                  value: >-
                    {{ 'Bypass did not open' if is_state('binary_sensor.crispy_bypass_open_failed', 'on') else 'No delivered cooling' }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.crispy_watchdog_intake
                data:
                  value: "{{ [[states('sensor.crispy_hrc_intake_temperature') | float(0), -40] | max, 80] | min }}"
              - action: timer.start
                target:
                  entity_id: timer.crispy_cooling_retry
          - conditions:
              - condition: trigger
                id: improved
              - condition: state
                entity_id: binary_sensor.crispy_cooling_retry_improved
                state: "on"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.crispy_cooling_retry

  # --------------------------------------------------------------
  # DECISION FLIGHT RECORDER
  # --------------------------------------------------------------

  - id: crispy_decision_trace
    alias: Crispy - Decision Flight Recorder
    mode: restart

    triggers:
      - trigger: homeassistant
        event: start
        id: startup

      - trigger: state
        entity_id:
          - input_select.crispy_thermal_phase
          - sensor.crispy_applied_thermal_demand
          - sensor.crispy_requested_fan_mode
          - sensor.crispy_hrc_fan_mode
          - binary_sensor.crispy_hrc_bypass_open
          - binary_sensor.crispy_cooling_watchdog_blocked
          - sensor.crispy_forecast_heat_risk
          - sensor.crispy_forecast_current_window_hours
          - binary_sensor.crispy_forecast_fresh
          - input_text.crispy_watchdog_reason
          - sensor.crispy_control_reason
        id: state

    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:40"

      - variables:
          trace: >-
            {{
              (states('input_select.crispy_thermal_phase') | upper)
              ~ ' · thermal ' ~ (states('sensor.crispy_applied_thermal_demand') | upper)
              ~ ' · fan ' ~ (states('sensor.crispy_requested_fan_mode') | upper)
              ~ '→' ~ (states('sensor.crispy_hrc_fan_mode') | upper)
              ~ ' · bypass ' ~ ('OPEN' if is_state('binary_sensor.crispy_hrc_bypass_open', 'on') else 'AUTO/HX')
              ~ ' · risk ' ~ (states('sensor.crispy_forecast_heat_risk') | upper)
              ~ ' · window ' ~ states('sensor.crispy_forecast_current_window_hours') ~ 'h'
              ~ ' · forecast ' ~ ('fresh' if is_state('binary_sensor.crispy_forecast_fresh', 'on') else 'inactive')
              ~ ' · ' ~ states('sensor.crispy_control_reason')
            }}

      - if:
          - condition: template
            value_template: "{{ trace != states('input_text.crispy_decision_trace') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.crispy_decision_trace
            data:
              value: "{{ trace[:255] }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.crispy_last_decision_change
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: logbook.log
            data:
              name: Crispy
              message: "{{ trace }}"
              entity_id: input_select.crispy_thermal_phase


  # --------------------------------------------------------------
  # FAN DEMAND DWELL
  #
  # Escalation is immediate. The visible step-down sensor turns on only after
  # HIGH -> MEDIUM demand has remained lower for twelve minutes. LOW/NONE
  # release immediately; Guest Quiet suppresses boosts after this helper.
  # --------------------------------------------------------------

  - id: crispy_fan_demand_dwell
    alias: Crispy - Fan Demand Dwell
    mode: queued
    max: 10

    triggers:
      - trigger: homeassistant
        event: start
        id: startup

      - trigger: state
        entity_id: sensor.crispy_raw_fan_demand
        id: demand

      - trigger: state
        entity_id: input_boolean.crispy_mode
        id: mode

      - trigger: state
        entity_id: binary_sensor.crispy_fan_step_down_ready
        to: "on"
        id: step_down

      - trigger: state
        entity_id: binary_sensor.crispy_stale_fan_hold
        to: "on"
        id: stale_hold

      - trigger: state
        entity_id: input_select.crispy_thermal_phase
        to: "cruise"
        id: cruise

      - trigger: state
        entity_id: binary_sensor.crispy_cooling_watchdog_blocked
        to: "on"
        id: watchdog

      - trigger: time_pattern
        minutes: "/1"
        id: reconcile

    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:30"

      - if:
          - condition: trigger
            id: cruise
        then:
          # Let the phase-dependent applied-demand template settle first.
          - delay: "00:00:01"

      - variables:
          desired: "{{ states('sensor.crispy_raw_fan_demand') }}"
          held: "{{ states('input_select.crispy_held_fan_demand') }}"
          desired_rank: >-
            {{ {'none':0,'low':1,'medium':2,'high':3}.get(states('sensor.crispy_raw_fan_demand'), -1) }}
          held_rank: >-
            {{ {'none':0,'low':1,'medium':2,'high':3}.get(states('input_select.crispy_held_fan_demand'), 0) }}

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ (trigger.id == 'mode' and is_state('input_boolean.crispy_mode', 'off'))
                     or desired_rank in [0, 1] }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_held_fan_demand
                data:
                  option: "{{ 'none' if is_state('input_boolean.crispy_mode', 'off') else desired }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    is_state('binary_sensor.crispy_cooling_watchdog_blocked', 'on')
                    and desired_rank >= 0
                    and desired_rank < held_rank
                  }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_held_fan_demand
                data:
                  option: "{{ desired }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    trigger.id == 'cruise'
                    and is_state('input_select.crispy_thermal_phase', 'cruise')
                    and desired_rank >= 0
                    and desired_rank < held_rank
                  }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_held_fan_demand
                data:
                  option: "{{ desired }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    is_state('binary_sensor.crispy_stale_fan_hold', 'on')
                    and desired_rank >= 0
                    and desired_rank < held_rank
                  }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_held_fan_demand
                data:
                  option: "{{ desired }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    desired_rank >= 0
                    and (
                      trigger.id == 'startup'
                      or (trigger.id == 'mode' and is_state('input_boolean.crispy_mode', 'on'))
                      or desired_rank > held_rank
                    )
                  }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_held_fan_demand
                data:
                  option: "{{ desired }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    is_state('binary_sensor.crispy_fan_step_down_ready', 'on')
                    and desired_rank >= 0
                    and desired_rank < held_rank
                  }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_held_fan_demand
                data:
                  option: "{{ desired }}"


  # --------------------------------------------------------------
  # THERMAL PRESSURE LATCH
  #
  # The visible candidate sensor owns the 10-minute arm timer. Confidence
  # gates it after startup; the release timer still uses trigger-level `for:`.
  # --------------------------------------------------------------

  - id: crispy_thermal_pressure_latch
    alias: Crispy - Thermal Pressure Latch
    mode: queued
    max: 10

    triggers:
      - trigger: state
        id: arm
        entity_id: binary_sensor.crispy_thermal_pressure_candidate
        to: "on"
        for: "00:10:00"

      - trigger: template
        id: release_stable
        value_template: >-
          {{
            is_state('input_boolean.crispy_thermal_pressure_active','on')
            and (states('sensor.crispy_indoor_fast_rate') | float(0)) < 0.04
          }}
        for: "00:15:00"

      - trigger: template
        id: release_safety
        value_template: >-
          {{
            is_state('input_boolean.crispy_thermal_pressure_active','on')
            and (
              not is_state('input_boolean.crispy_mode','on')
              or not is_state('binary_sensor.crispy_sensors_healthy','on')
              or not is_state('binary_sensor.crispy_momentum_confident','on')
              or (states('sensor.crispy_hrc_intake_temperature') | float(99))
                   < (states('input_number.crispy_min_intake') | float(12))
              or (states('sensor.crispy_hrc_indoor_temperature') | float(99))
                   <= (states('sensor.crispy_effective_target') | float(19.5))
              or (
                (states('sensor.crispy_hrc_indoor_temperature') | float(99))
                - (states('sensor.crispy_hrc_intake_temperature') | float(99))
              ) < 0.5
            )
          }}

    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: arm
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.crispy_thermal_pressure_active

          - conditions:
              - condition: trigger
                id:
                  - release_stable
                  - release_safety
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_thermal_pressure_active


  # --------------------------------------------------------------
  # MOISTURE DEMAND LATCH
  #
  # Start: indoor RH >= 60% or RH rising quickly, while intake air
  # is genuinely drier in absolute-humidity terms.
  # Stop: RH <= 55% and stable, or outside air can no longer help.
  # --------------------------------------------------------------

  - id: crispy_moisture_demand_latch
    alias: Crispy - Moisture Demand Latch
    mode: restart

    triggers:
      - trigger: state
        entity_id:
          - input_boolean.crispy_moisture_control
          - sensor.crispy_hrc_indoor_humidity
          - sensor.crispy_drying_advantage
          - sensor.crispy_indoor_humidity_rate
      - trigger: time_pattern
        minutes: "/2"

    actions:
      - variables:
          control: "{{ is_state('input_boolean.crispy_moisture_control','on') }}"
          rh: "{{ states('sensor.crispy_hrc_indoor_humidity') | float(0) }}"
          advantage: "{{ states('sensor.crispy_drying_advantage') | float(-99) }}"
          rate: "{{ states('sensor.crispy_indoor_humidity_rate') | float(0) }}"
          active: "{{ is_state('input_boolean.crispy_moisture_active','on') }}"

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{
                    not control
                    or not has_value('sensor.crispy_hrc_indoor_humidity')
                    or not has_value('sensor.crispy_drying_advantage')
                  }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_moisture_active

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    active
                    and
                    (
                      advantage <= 0.1
                      or (rh <= 55 and rate <= 0.2)
                    )
                  }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_moisture_active

          - conditions:
              - condition: template
                value_template: >-
                  {{
                    not active
                    and advantage >= 0.3
                    and (rh >= 60 or rate >= 2.0)
                  }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.crispy_moisture_active


  # --------------------------------------------------------------
  # LAUNDRY DRYING MODE
  # --------------------------------------------------------------

  - id: crispy_laundry_mode_lifecycle
    alias: Crispy - Laundry Mode Lifecycle
    mode: restart

    triggers:
      - trigger: state
        entity_id: input_boolean.crispy_laundry_mode
        id: laundry

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'on' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.crispy_laundry_baseline_ah
                data:
                  value: "{{ states('sensor.crispy_indoor_absolute_humidity') | float(0) }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_laundry_wet_seen
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.crispy_mode
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_laundry_wet_seen

  - id: crispy_laundry_wet_seen
    alias: Crispy - Laundry Wet Load Detected
    mode: single

    triggers:
      - trigger: template
        value_template: >-
          {{
            is_state('input_boolean.crispy_laundry_mode','on')
            and not is_state('input_boolean.crispy_laundry_wet_seen','on')
            and has_value('sensor.crispy_indoor_absolute_humidity')
            and
            states('sensor.crispy_indoor_absolute_humidity') | float(0)
              >= states('input_number.crispy_laundry_baseline_ah') | float(0) + 0.5
          }}

    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.crispy_laundry_wet_seen

  - id: crispy_laundry_auto_complete
    alias: Crispy - Laundry Auto Complete
    mode: single

    triggers:
      - trigger: template
        value_template: >-
          {{
            is_state('input_boolean.crispy_laundry_mode','on')
            and is_state('input_boolean.crispy_laundry_wet_seen','on')
            and has_value('sensor.crispy_indoor_absolute_humidity')
            and
            states('sensor.crispy_indoor_absolute_humidity') | float(99)
              <= states('input_number.crispy_laundry_baseline_ah') | float(0) + 0.3
            and (states('sensor.crispy_indoor_ah_rate') | float(99) | abs) <= 0.15
          }}
        for: "00:30:00"

    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crispy_laundry_mode


  # --------------------------------------------------------------
  # EXTERNAL HIGHER-DEMAND ARBITRATION
  #
  # If the HRC moves to a higher fan mode without a recent Crispy
  # fan command, Crispy treats it as an external demand (Orcon,
  # physical remote, moisture logic, etc.) and will not step it down.
  # Lower external commands are still overridden by Crispy.
  # --------------------------------------------------------------

  - id: crispy_detect_external_higher_demand
    alias: Crispy - Detect / Maintain External Higher Demand
    mode: queued
    max: 5

    triggers:
      - trigger: state
        entity_id: sensor.crispy_hrc_fan_mode

    conditions:
      - condition: state
        entity_id: input_boolean.crispy_mode
        state: "on"

    actions:
      - variables:
          actual: "{{ trigger.to_state.state if trigger.to_state else 'unknown' }}"
          requested: "{{ states('sensor.crispy_requested_fan_mode') }}"
          latched: "{{ states('input_select.crispy_external_latched_mode') }}"
          last_cmd_ts: >-
            {{ as_timestamp(states('input_datetime.crispy_last_rf_fan_command'), 0) }}
          cmd_age: "{{ as_timestamp(now()) - last_cmd_ts }}"
          actual_rank: >-
            {{ {'low':1,'medium':2,'high':3}.get(actual,0) }}
          requested_rank: >-
            {{ {'none':0,'low':1,'medium':2,'high':3}.get(requested,0) }}
          latched_rank: >-
            {{ {'none':0,'low':1,'medium':2,'high':3}.get(latched,0) }}

      - choose:
          # LOWER external/manual commands do not override a higher Crispy demand.
          # Clear any stale external-higher latch. The controller also listens to
          # actual fan-mode changes and will reassert the requested level.
          - conditions:
              - condition: template
                value_template: >-
                  {{
                    actual_rank > 0
                    and actual_rank < requested_rank
                    and cmd_age > 3
                  }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.crispy_external_override
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_external_latched_mode
                data:
                  option: none

          # No latch yet: a fan level above Crispy demand, not caused by a
          # recent Crispy RF command, becomes the external-demand latch.
          - conditions:
              - condition: template
                value_template: >-
                  {{
                    not is_state('input_boolean.crispy_external_override','on')
                    and actual_rank > requested_rank
                    and cmd_age > 20
                  }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_external_latched_mode
                data:
                  option: "{{ actual }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.crispy_external_override

          # Already latched and the HRC stepped DOWN. If it is still above
          # Crispy demand, keep protection but move the latch down with it.
          # Otherwise the external demand has ended and Crispy may resume.
          - conditions:
              - condition: template
                value_template: >-
                  {{
                    is_state('input_boolean.crispy_external_override','on')
                    and actual_rank < latched_rank
                  }}
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ actual_rank > requested_rank }}"
                    sequence:
                      - action: input_select.select_option
                        target:
                          entity_id: input_select.crispy_external_latched_mode
                        data:
                          option: "{{ actual }}"
                default:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.crispy_external_override
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.crispy_external_latched_mode
                    data:
                      option: none

  - id: crispy_clear_external_higher_demand
    alias: Crispy - Release External Higher Demand Latch
    mode: restart

    triggers:
      - trigger: state
        entity_id: input_boolean.crispy_mode
      - trigger: time_pattern
        minutes: "/1"

    actions:
      # Do NOT clear merely because Crispy's requested level rises to the
      # actual level. The latch represents an observed external request.
      # It is released by the fan stepping below the latched level (handled
      # above), or immediately when Crispy itself is disabled.
      - if:
          - condition: state
            entity_id: input_boolean.crispy_mode
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.crispy_external_override
          - action: input_select.select_option
            target:
              entity_id: input_select.crispy_external_latched_mode
            data:
              option: none


  # --------------------------------------------------------------
  # CRISPY CONTROLLER V3
  #
  # Fan arbitration:
  #   raw demand = max(thermal, moisture, laundry)
  #   HIGH -> MEDIUM dwells for 12 minutes; LOW/NONE release to AUTO now
  #   Guest Quiet suppresses Crispy boosts and releases to native AUTO
  #   any detected external HIGHER demand is preserved
  #
  # Bypass arbitration:
  #   thermal cooling and a still-useful held cooling request force OPEN
  #   standalone moisture/laundry fan demand leaves bypass in AUTO
  #
  # Full Send:
  #   HIGH whenever indoor > target and intake is actually cooler,
  #   ignoring the normal 0.5 / 1 / 3 C fan ladder.
  # --------------------------------------------------------------

  - id: crispy_controller_v2
    alias: HRC - Crispy Mode V2
    mode: queued
    max: 3

    triggers:
      - trigger: homeassistant
        event: start
        id: startup

      - trigger: state
        entity_id:
          - input_boolean.crispy_mode
          - input_boolean.crispy_quiet_mode
          - input_boolean.crispy_heatwave_mode
          - input_boolean.crispy_moisture_active
          - input_boolean.crispy_laundry_mode
          - input_boolean.crispy_external_override
          - input_select.crispy_control_strategy
          - input_number.crispy_target
          - input_number.crispy_min_intake
          - sensor.crispy_hrc_indoor_temperature
          - sensor.crispy_hrc_intake_temperature
          - sensor.crispy_hrc_fan_mode
          - sensor.crispy_requested_fan_mode
          - sensor.crispy_thermal_demand
          - binary_sensor.crispy_bypass_requested
        id: state

      - trigger: time_pattern
        minutes: "/5"
        id: heartbeat

    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'startup' }}"
        then:
          # The dwell automation reconciles its restored state at 30 seconds.
          - delay: "00:00:35"

      - variables:
          last_mode: "{{ states('input_select.crispy_last_auto_mode') }}"
          fan_mode: "{{ states('sensor.crispy_hrc_fan_mode') }}"
          remaining: "{{ states('sensor.crispy_hrc_remaining_time') | int(0) }}"
          external_higher: >-
            {{
              is_state('input_boolean.crispy_external_override','on')
              and states('input_select.crispy_external_latched_mode') != 'none'
              and {'low':1,'medium':2,'high':3}.get(states('sensor.crispy_hrc_fan_mode'), 0)
                > {'none':0,'medium':2,'high':3}.get(states('sensor.crispy_requested_fan_mode'), 0)
            }}
          release_fan: >-
            {{
              is_state('input_boolean.crispy_fan_override_active', 'on')
              or last_mode in ['low', 'medium', 'high']
            }}
          desired: "{{ states('sensor.crispy_expected_mode') }}"

      - choose:

          # OFF / FAULT / FROST: stop forcing bypass and leave fan to HRC.
          - conditions:
              - condition: template
                value_template: "{{ desired in ['off','fault','frost'] }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state('input_boolean.crispy_bypass_forced','on') or last_mode != desired }}
                then:
                  - action: script.crispy_send_bypass_auto
              - if:
                  - condition: template
                    value_template: "{{ release_fan }}"
                then:
                  - action: script.crispy_send_fan_auto
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_last_auto_mode
                data:
                  option: "{{ desired }}"

          # TARGET / HOLD: release only our fan request. Thermal cooling can
          # still need OPEN while native AUTO chooses the ventilation speed.
          - conditions:
              - condition: template
                value_template: "{{ desired in ['target','hold'] }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ release_fan }}"
                then:
                  - action: script.crispy_send_fan_auto
              - action: script.crispy_apply_bypass_policy
              - action: input_select.select_option
                target:
                  entity_id: input_select.crispy_last_auto_mode
                data:
                  option: "{{ desired }}"

          # FAN DEMAND
          - conditions:
              - condition: template
                value_template: "{{ desired in ['medium','high'] }}"
            sequence:

              - action: script.crispy_apply_bypass_policy

              # A higher external demand is sacred: observe, do not renew or step down.
              - if:
                  - condition: template
                    value_template: "{{ external_higher }}"
                then:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.crispy_last_auto_mode
                    data:
                      option: "external"
                else:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.crispy_fan_override_active
                  - choose:

                      - conditions:
                          - condition: template
                            value_template: "{{ desired == 'medium' }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ last_mode != 'medium' or remaining <= 10 or fan_mode != 'medium' }}
                            then:
                              - action: script.crispy_send_medium_60
                              - wait_template: "{{ is_state('sensor.crispy_hrc_fan_mode','medium') }}"
                                timeout: "00:00:10"
                                continue_on_timeout: true
                              - if:
                                  - condition: template
                                    value_template: "{{ not is_state('sensor.crispy_hrc_fan_mode','medium') }}"
                                then:
                                  - action: script.crispy_send_medium_60
                                  - wait_template: "{{ is_state('sensor.crispy_hrc_fan_mode','medium') }}"
                                    timeout: "00:00:10"
                                    continue_on_timeout: true

                      - conditions:
                          - condition: template
                            value_template: "{{ desired == 'high' }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ last_mode != 'high' or remaining <= 10 or fan_mode != 'high' }}
                            then:
                              - action: script.crispy_send_high_60
                              - wait_template: "{{ is_state('sensor.crispy_hrc_fan_mode','high') }}"
                                timeout: "00:00:10"
                                continue_on_timeout: true
                              - if:
                                  - condition: template
                                    value_template: "{{ not is_state('sensor.crispy_hrc_fan_mode','high') }}"
                                then:
                                  - action: script.crispy_send_high_60
                                  - wait_template: "{{ is_state('sensor.crispy_hrc_fan_mode','high') }}"
                                    timeout: "00:00:10"
                                    continue_on_timeout: true

                  - action: input_select.select_option
                    target:
                      entity_id: input_select.crispy_last_auto_mode
                    data:
                      option: "{{ desired }}"
