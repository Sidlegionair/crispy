            heading: About Crispy
            icon: mdi:information-outline
          - type: markdown
            content: >-
              **❄️ Crispy** is a supervisory controller over the existing HRC.
              It combines thermal free-cooling, sustained thermal-momentum
              rejection, recent heat-gain memory, moisture demand and Laundry
              Drying Mode, while preserving any detected external fan demand
              that is higher than Crispy's own request. **AUTO** uses the normal
              Delta-T fan ladder; **FULL SEND** keeps HIGH going until target
              whenever intake is actually cooler. Only thermal cooling forces
              bypass OPEN; otherwise bypass authority stays with the HRC.
              Cooling W and kWh are estimates of **thermal heat removal**, not
              ventilation electrical consumption.
            grid_options:
              columns: 12
