views:
  - title: Crispy
    path: crispy
    icon: mdi:snowflake
    type: sections
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: >-
          # ❄️ Crispy

          **{{ states('sensor.crispy_status') }}** · {{
          states('sensor.crispy_cooling_power') }} W · {{
          states('sensor.fan_32_142350_indoor_temperature') | float | round(1)
          }}°C inside
    sections:
      - type: grid
        column_span: 2
        background:
          color: blue
          opacity: 8
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: input_boolean.crispy_mode
                icon: mdi:snowflake
                icon_color: >-
                  {{ 'light-blue' if is_state('input_boolean.crispy_mode','on')
                  else 'grey' }}
                content: >-
                  {{ 'ON' if is_state('input_boolean.crispy_mode','on') else
                  'OFF' }}
                tap_action:
                  action: toggle
              - type: template
                entity: input_select.crispy_control_strategy
                icon: mdi:strategy
                icon_color: >-
                  {{ 'red' if
                  is_state('input_select.crispy_control_strategy','Full Send')
                  else 'purple' }}
                content: '{{ states(''input_select.crispy_control_strategy'') | upper }}'
              - type: template
                entity: input_boolean.crispy_quiet_mode
                icon: mdi:volume-low
                icon_color: >-
                  {{ 'purple' if
                  is_state('input_boolean.crispy_quiet_mode','on') else 'grey'
                  }}
                content: >-
                  {{ 'GUEST QUIET' if
                  is_state('input_boolean.crispy_quiet_mode','on') else 'NO CAP'
                  }}
                tap_action:
                  action: toggle
              - type: template
                entity: input_boolean.crispy_moisture_active
                icon: mdi:water-alert
                icon_color: >-
                  {{ 'blue' if
                  is_state('input_boolean.crispy_moisture_active','on') else
                  'grey' }}
                content: >-
                  {{ 'MOISTURE' if
                  is_state('input_boolean.crispy_moisture_active','on') else
                  'DRY' }}
              - type: template
                entity: input_boolean.crispy_laundry_mode
                icon: mdi:hanger
                icon_color: >-
                  {{ 'cyan' if
                  is_state('input_boolean.crispy_laundry_mode','on') else 'grey'
                  }}
                content: >-
                  {{ 'LAUNDRY' if
                  is_state('input_boolean.crispy_laundry_mode','on') else 'NO
                  LAUNDRY' }}
              - type: template
                entity: sensor.crispy_cooling_power
                icon: mdi:snowflake-thermometer
                icon_color: light-blue
                content: '{{ states(''sensor.crispy_cooling_power'') }} W'
              - type: template
                entity: sensor.crispy_expected_mode
                icon: mdi:state-machine
                icon_color: >-
                  {{ 'green' if states('sensor.crispy_expected_mode') ==
                  states('sensor.fan_32_142350_fan_mode') else 'purple' }}
                content: AUTO {{ states('sensor.crispy_expected_mode') | upper }}
              - type: template
                entity: sensor.fan_32_142350_fan_mode
                icon: mdi:fan
                icon_color: cyan
                content: '{{ states(''sensor.fan_32_142350_fan_mode'') | upper }}'
              - type: template
                entity: binary_sensor.fan_32_142350_bypass_position
                icon: mdi:valve-open
                icon_color: >-
                  {{ 'cyan' if
                  is_state('binary_sensor.fan_32_142350_bypass_position','on')
                  else 'grey' }}
                content: >-
                  {{ 'BYPASS' if
                  is_state('binary_sensor.fan_32_142350_bypass_position','on')
                  else 'HX' }}
              - type: template
                entity: sensor.fan_32_142350_remaining_time
                icon: mdi:timer-outline
                icon_color: blue
                content: '{{ states(''sensor.fan_32_142350_remaining_time'') }}m'
              - type: template
                entity: binary_sensor.crispy_sensors_healthy
                icon: >-
                  {{ 'mdi:check-circle' if
                  is_state('binary_sensor.crispy_sensors_healthy','on') else
                  'mdi:alert-circle' }}
                icon_color: >-
                  {{ 'green' if
                  is_state('binary_sensor.crispy_sensors_healthy','on') else
                  'red' }}
                content: >-
                  {{ 'RF OK' if
                  is_state('binary_sensor.crispy_sensors_healthy','on') else
                  'FAULT' }}
          - type: custom:mushroom-template-card
            entity: input_boolean.crispy_mode
            primary: '{{ states(''sensor.crispy_status'') | upper }}'
            secondary: >-
              {{ states('sensor.fan_32_142350_indoor_temperature') | float |
              round(1) }}°C indoor  →  {{
              states('sensor.fan_32_142350_supply_temperature') | float |
              round(1) }}°C supply

              Intake {{ states('sensor.fan_32_142350_outdoor_temperature') |
              float | round(1) }}°C · ΔT {{ states('sensor.crispy_delta_t') |
              float | round(1) }}°C · {{ states('sensor.crispy_cooling_power')
              }} W
            icon: mdi:snowflake
            color: >-
              {{ 'light-blue' if is_state('input_boolean.crispy_mode','on') else
              'grey' }}
            badge_icon: >-
              {{ 'mdi:check' if
              is_state('binary_sensor.crispy_controller_synced','on') else
              'mdi:alert' }}
            badge_color: >-
              {{ 'green' if
              is_state('binary_sensor.crispy_controller_synced','on') else 'red'
              }}
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: 3
          - type: custom:mushroom-template-card
            entity: script.crispy_max
            primary: MAX CRISPY
            secondary: Full automatic attack
            icon: mdi:snowflake-alert
            color: light-blue
            vertical: true
            tap_action:
              action: perform-action
              confirmation:
                text: Engage MAX CRISPY?
              perform_action: script.turn_on
              target:
                entity_id: script.crispy_max
            grid_options:
              columns: 6
              rows: 3
          - type: custom:mushroom-template-card
            entity: script.crispy_normal
            primary: NORMAL
            secondary: Release to HRC
            icon: mdi:home-thermometer
            color: green
            vertical: true
            tap_action:
              action: perform-action
              confirmation:
                text: Return to normal ventilation?
              perform_action: script.turn_on
              target:
                entity_id: script.crispy_normal
            grid_options:
              columns: 6
              rows: 3
          - type: custom:mushroom-template-card
            entity: input_boolean.crispy_quiet_mode
            primary: GUEST QUIET
            secondary: >-
              {{ 'Crispy capped at LOW · native demand still wins' if
              is_state('input_boolean.crispy_quiet_mode','on') else
              'Allow the full automatic fan range' }}
            icon: mdi:volume-low
            color: >-
              {{ 'purple' if
              is_state('input_boolean.crispy_quiet_mode','on') else 'grey' }}
            tap_action:
              action: toggle
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-select-card
            entity: input_select.crispy_control_strategy
            name: Cooling strategy
            icon: mdi:strategy
            fill_container: true
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-template-card
            entity: input_boolean.crispy_laundry_mode
            primary: LAUNDRY DRYING
            secondary: >-
              {{ states('sensor.crispy_laundry_status') }} · ΔAH {{
              states('sensor.crispy_drying_advantage') }} g/m³
            icon: mdi:hanger
            color: >-
              {{ 'cyan' if is_state('input_boolean.crispy_laundry_mode','on')
              else 'grey' }}
            tap_action:
              action: toggle
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-number-card
            entity: input_number.crispy_target
            name: Target
            icon: mdi:bullseye-arrow
            display_mode: buttons
            fill_container: true
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        column_span: 4
        background:
          color: purple
          opacity: 6
        cards:
          - type: heading
            heading: Decision Engine
            icon: mdi:state-machine
          - type: custom:mushroom-template-card
            entity: sensor.crispy_expected_mode
            primary: CRISPY WANTS {{ states('sensor.crispy_expected_mode') | upper }}
            secondary: >-
              {{ states('sensor.crispy_control_reason') }} · Raw {{
              states('sensor.crispy_raw_fan_demand') | upper }} → request {{
              states('sensor.crispy_requested_fan_mode') | upper }} → actual {{
              states('sensor.fan_32_142350_fan_mode') | upper }} · Thermal {{
              states('sensor.crispy_thermal_demand') | upper }} · Moisture {{
              states('sensor.crispy_moisture_demand') | upper }} · Laundry {{
              states('sensor.crispy_laundry_demand') | upper }}
            icon: mdi:brain
            color: >-
              {% set m = states('sensor.crispy_expected_mode') %} {% if m ==
              'high' %} red {% elif m == 'medium' %} cyan {% elif m == 'low' %}
              light-blue {% elif m in ['fault','frost'] %} orange {% else %}
              grey {% endif %}
            badge_icon: >-
              {{ 'mdi:check' if states('sensor.crispy_expected_mode') ==
              states('sensor.fan_32_142350_fan_mode') else 'mdi:alert' }}
            badge_color: >-
              {{ 'green' if states('sensor.crispy_expected_mode') ==
              states('sensor.fan_32_142350_fan_mode') else 'red' }}
            multiline_secondary: true
            grid_options:
              columns: 48
              rows: 3
          - type: custom:mushroom-template-card
            entity: sensor.crispy_base_thermal_demand
            primary: BASE {{ states('sensor.crispy_base_thermal_demand') | upper }}
            secondary: >-
              ΔT {{ states('sensor.crispy_delta_t') | float(0) | round(1) }}°C ·
              normal cooling ladder
            icon: mdi:snowflake-thermometer
            color: >-
              {% set d = states('sensor.crispy_base_thermal_demand') %} {{ 'red'
              if d == 'high' else 'cyan' if d == 'medium' else 'light-blue' if d
              == 'low' else 'grey' }}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_thermal_momentum_demand
            primary: >-
              MOMENTUM {{ states('sensor.crispy_thermal_momentum_demand') |
              upper }}
            secondary: >-
              {{ states('sensor.crispy_thermal_momentum') | replace('_',' ') |
              upper }} · {{ '%+.2f' |
              format(states('sensor.crispy_indoor_fast_rate') | float(0)) }}°C/h
              · pressure {{ 'ON' if
              is_state('input_boolean.crispy_thermal_pressure_active','on') else
              'off' }}
            icon: >-
              {% set r = states('sensor.crispy_indoor_fast_rate') | float(0) %}
              {{ 'mdi:trending-up' if r >= 0.04 else 'mdi:trending-down' if r <=
              -0.03 else 'mdi:trending-neutral' }}
            color: >-
              {% set d = states('sensor.crispy_thermal_momentum_demand') %} {%
              set r = states('sensor.crispy_indoor_fast_rate') | float(0) %} {{
              'red' if d == 'high' else 'orange' if d == 'medium' else 'amber'
              if r >= 0.04 else 'light-blue' if r <= -0.03 else 'grey' }}
            multiline_secondary: true
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_recent_heat_gain_demand
            primary: >-
              HEAT MEMORY {{ states('sensor.crispy_recent_heat_gain_demand') |
              upper }}
            secondary: >-
              +{{ states('sensor.crispy_recent_heat_gain') | float(0) | round(2)
              }}°C since 2h low · low {{
              states('sensor.crispy_indoor_recent_low') | float(0) | round(2)
              }}°C
            icon: mdi:thermometer-chevron-up
            color: >-
              {% set d = states('sensor.crispy_recent_heat_gain_demand') %} {%
              set g = states('sensor.crispy_recent_heat_gain') | float(0) %} {{
              'red' if d == 'high' else 'orange' if d == 'medium' else
              'light-blue' if d == 'low' else 'amber' if g >= 0.5 else 'grey' }}
            multiline_secondary: true
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_thermal_demand
            primary: FINAL THERMAL {{ states('sensor.crispy_thermal_demand') | upper }}
            secondary: Strongest of base · momentum · heat memory
            icon: mdi:arrow-decision
            color: >-
              {% set d = states('sensor.crispy_thermal_demand') %} {{ 'red' if d
              == 'high' else 'cyan' if d == 'medium' else 'light-blue' if d ==
              'low' else 'grey' }}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.fan_32_142350_indoor_temperature
            primary: >-
              {{ states('sensor.fan_32_142350_indoor_temperature') | float(0) |
              round(1) }}°C
            secondary: >-
              INDOOR · {{ '%+.1f' |
              format((states('sensor.fan_32_142350_indoor_temperature') |
              float(0)) - (states('sensor.crispy_effective_target') | float(0)))
              }}°C vs target
            icon: mdi:home-thermometer
            color: >-
              {% set gap = (states('sensor.fan_32_142350_indoor_temperature') |
              float(0)) - (states('sensor.crispy_effective_target') | float(0))
              %} {{ 'red' if gap >= 2 else 'orange' if gap >= 1 else 'amber' if
              gap > 0.3 else 'green' }}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_effective_target
            primary: >-
              {{ states('sensor.crispy_effective_target') | float(0) | round(1)
              }}°C
            secondary: EFFECTIVE TARGET · heat-memory guard +0.3°C
            icon: mdi:bullseye-arrow
            color: purple
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.fan_32_142350_outdoor_temperature
            primary: >-
              {{ states('sensor.fan_32_142350_outdoor_temperature') | float(0) |
              round(1) }}°C
            secondary: >-
              INTAKE · cold guard {{ states('input_number.crispy_min_intake') |
              float(0) | round(1) }}°C
            icon: mdi:weather-windy
            color: light-blue
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_delta_t
            primary: '{{ states(''sensor.crispy_delta_t'') | float(0) | round(1) }}°C'
            secondary: >-
              COOLING ADVANTAGE · {% set d = states('sensor.crispy_delta_t') |
              float(0) %} {{ 'HIGH territory' if d >= 3 else 'MEDIUM territory'
              if d >= 1 else 'LOW territory' if d >= 0.5 else 'too small' }}
            icon: mdi:thermometer-chevron-down
            color: >-
              {% set d = states('sensor.crispy_delta_t') | float(0) %} {{ 'red'
              if d >= 3 else 'cyan' if d >= 1 else 'light-blue' if d >= 0.5 else
              'grey' }}
            multiline_secondary: true
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_moisture_demand
            primary: MOISTURE {{ states('sensor.crispy_moisture_demand') | upper }}
            secondary: Independent ventilation demand
            icon: mdi:water-alert
            color: blue
            grid_options:
              columns: 24
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_laundry_demand
            primary: LAUNDRY {{ states('sensor.crispy_laundry_demand') | upper }}
            secondary: Independent drying demand
            icon: mdi:hanger
            color: cyan
            grid_options:
              columns: 24
              rows: 2
          - type: markdown
            content: >-
              **Temperature levels & escalation**

              **Base ΔT ladder:** `<0.5°C` = NONE · `0.5–<1.0°C` = LOW ·
              `1.0–<3.0°C` = MEDIUM · `≥3.0°C` = HIGH.

              **Fast momentum (15 min):** `≤−0.10°C/h` = cooling fast ·
              `−0.10–−0.03` = cooling · `−0.03–<+0.04` = stable · `+0.04–<+0.10`
              = warming · `≥+0.10` = warming fast. Sustained warming for 10 min
              arms **thermal pressure**. Once armed, warming or stable pressure
              escalates the base demand one step (LOW→MEDIUM, MEDIUM→HIGH), while
              fast warming requests HIGH. Genuine cooling below `−0.03°C/h`
              suppresses the boost; the pressure latch releases after 15 min
              without qualifying warming.

              **Heat memory:** recent gain is current indoor temperature minus
              the lowest indoor temperature seen over roughly 2 hours. `<0.5°C`
              adds nothing. At `≥0.5°C`, Crispy escalates the base demand one
              useful step (LOW→MEDIUM, MEDIUM→HIGH). At `≥1.0°C`, it requests
              HIGH. Heat-memory escalation only applies above `target + 0.3°C`,
              with at least `0.5°C` cooling advantage and a safe intake
              temperature.

              **Final thermal demand = strongest of Base, Momentum and Heat
              Memory.** Thermal, Moisture and Laundry are then arbitrated into
              one raw demand. Guest Quiet caps Crispy's resulting MEDIUM or HIGH
              request to LOW. A detected higher external HRC demand is still
              preserved.
            grid_options:
              columns: 48
              rows: 7
      - type: grid
        column_span: 2
        background:
          color: cyan
          opacity: 6
        cards:
          - type: heading
            heading: Tonight
            icon: mdi:weather-night
          - type: custom:mushroom-template-card
            entity: sensor.crispy_forecast_outlook
            primary: '{{ states(''sensor.crispy_forecast_outlook'') | upper }}'
            secondary: >-
              {{ states('sensor.crispy_forecast_useful_cooling_hours') }} useful
              hours · window {{ states('sensor.crispy_forecast_cooling_window')
              }}
            icon: mdi:weather-night
            color: light-blue
            multiline_secondary: true
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_forecast_lowest_outdoor
            primary: '{{ states(''sensor.crispy_forecast_lowest_outdoor'') }}°C'
            secondary: Forecast outdoor low
            icon: mdi:thermometer-low
            color: blue
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_forecast_lowest_intake
            primary: '{{ states(''sensor.crispy_forecast_lowest_intake'') }}°C'
            secondary: Estimated HRC intake low
            icon: mdi:weather-windy
            color: cyan
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_forecast_best_time
            primary: '{{ states(''sensor.crispy_forecast_best_time'') }}'
            secondary: Coldest forecast
            icon: mdi:clock-star-four-points
            color: purple
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_forecast_cooling_potential
            primary: '{{ states(''sensor.crispy_forecast_cooling_potential'') }} kWh'
            secondary: Estimated overnight cooling opportunity
            icon: mdi:snowflake-variant
            color: light-blue
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_forecast_peak_cooling
            primary: '{{ states(''sensor.crispy_forecast_peak_cooling'') }} W'
            secondary: Estimated peak potential
            icon: mdi:lightning-bolt
            color: cyan
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_tomorrow_max
            primary: '{{ states(''sensor.crispy_tomorrow_max'') }}°C'
            secondary: Tomorrow forecast maximum
            icon: mdi:white-balance-sunny
            color: orange
            grid_options:
              columns: 12
              rows: 2
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live Air Path
            icon: mdi:air-filter
          - type: custom:mushroom-template-card
            entity: sensor.fan_32_142350_outdoor_temperature
            primary: >-
              {{ states('sensor.fan_32_142350_outdoor_temperature') | float |
              round(1) }}°
            secondary: INTAKE
            icon: mdi:weather-windy
            color: light-blue
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.fan_32_142350_supply_temperature
            primary: >-
              {{ states('sensor.fan_32_142350_supply_temperature') | float |
              round(1) }}°
            secondary: SUPPLY
            icon: mdi:air-conditioner
            color: cyan
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.fan_32_142350_indoor_temperature
            primary: >-
              {{ states('sensor.fan_32_142350_indoor_temperature') | float |
              round(1) }}°
            secondary: INDOOR
            icon: mdi:home-thermometer
            color: red
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_delivery_effectiveness
            primary: '{{ states(''sensor.crispy_delivery_effectiveness'') }}%'
            secondary: Cool-air delivery
            icon: mdi:gauge
            color: >-
              {% set e = states('sensor.crispy_delivery_effectiveness') | float
              %} {% if e >= 80 %}green {% elif e >= 60 %}light-blue {% else
              %}amber {% endif %}
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_heat_soak
            primary: +{{ states('sensor.crispy_heat_soak') | float | round(1) }}°C
            secondary: Duct / unit heat pickup
            icon: mdi:pipe
            color: amber
            grid_options:
              columns: 6
              rows: 2
          - type: markdown
            content: >-
              ℹ️ **Air path:** Intake is outside air entering the HRC; Supply is
              what reaches the apartment. Cool-air delivery shows how much of
              the available temperature advantage reaches the supply. Heat
              pickup is warming between intake and supply.
            grid_options:
              columns: 12
              rows: 2
      - type: grid
        column_span: 2
        background: true
        cards:
          - type: heading
            heading: Actual Performance
            icon: mdi:snowflake-thermometer
          - type: custom:mushroom-template-card
            entity: sensor.crispy_cooling_power
            primary: '{{ states(''sensor.crispy_cooling_power'') }} W'
            secondary: Cooling now
            icon: mdi:snowflake
            color: light-blue
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_indoor_rate
            primary: '{{ states(''sensor.crispy_indoor_rate'') }} °C/h'
            secondary: Apartment trend
            icon: mdi:trending-down
            color: |-
              {% if states('sensor.crispy_indoor_rate') | float < -0.15 %}
                light-blue
              {% elif states('sensor.crispy_indoor_rate') | float > 0.1 %}
                red
              {% else %}
                grey
              {% endif %}
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_eta_hours
            primary: >-
              {% if states('sensor.crispy_eta_hours') in
              ['unknown','unavailable'] %}
                —
              {% else %}
                {{ states('sensor.crispy_eta_hours') }} h
              {% endif %}
            secondary: ETA to target
            icon: mdi:timer-sand
            color: purple
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.crispy_cooling_tonight
            primary: >-
              {{ states('sensor.crispy_cooling_tonight') | float | round(2) }}
              kWh
            secondary: Removed since 18:00
