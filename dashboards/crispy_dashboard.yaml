              escalation after accumulated temperature gain; Thermal Final is
              the strongest of all three. Final demand is the overall arbiter
              output; Actual fan is what the HRC reports. Matching 24-hour
              windows make it possible to see a rise begin, Crispy intervene,
              and whether the slope bends back toward zero.
